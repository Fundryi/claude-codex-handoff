name: Bug report
description: A handoff, the plugin or the dashboard does something wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /codex:handoff ...
        2. Open the dashboard ...
        3. See ...
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      description: The version that /plugin shows for codex@fundryi.
      placeholder: "2.18.0"
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex CLI version
      description: The output of `codex --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, WSL, Docker]
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Where Claude Code runs
      options: [Terminal, VS Code extension, JetBrains plugin, CloudCLI, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs or job output
      description: The job id, and the job log or error text if you have it. Logs can hold text from your projects. Remove anything private before you post.
      render: text
