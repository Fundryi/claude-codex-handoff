name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use latest stable Rust
        run: rustup update stable

      - name: Build tray launcher
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo build --release --locked --manifest-path tray-launcher/Cargo.toml

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $folder = "dist/AI-Live-Viewer-Windows-x64"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          New-Item -ItemType Directory -Force -Path "$folder/assets" | Out-Null
          Copy-Item "tray-launcher/target/release/codex-live-viewer-tray.exe" "$folder/AI Live Viewer.exe"
          Copy-Item "codex-live-viewer.js", "viewer-ui.html", "README.md", "LICENSE" $folder
          Copy-Item "assets/logo.svg" "$folder/assets/logo.svg"
          # The companion Resume/Cancel run; the server finds it at plugin/scripts/.
          New-Item -ItemType Directory -Force -Path "$folder/plugin/.claude-plugin" | Out-Null
          Copy-Item -Recurse "plugin/scripts", "plugin/prompts", "plugin/schemas" "$folder/plugin/"
          Copy-Item "plugin/LICENSE", "plugin/NOTICE" "$folder/plugin/"
          Copy-Item "plugin/.claude-plugin/plugin.json" "$folder/plugin/.claude-plugin/plugin.json"
          Copy-Item "install-codex-notify-hook.bat" "$folder/install-codex-notify-hook.bat"
          Compress-Archive -Path $folder -DestinationPath "dist/AI-Live-Viewer-Windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/AI-Live-Viewer-Windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Use latest stable Rust
        run: rustup update stable

      - name: Build tray launcher
        run: cargo build --release --locked --manifest-path tray-launcher/Cargo.toml

      - name: Create Linux ZIP
        run: |
          folder="dist/AI-Live-Viewer-Linux-x64"
          mkdir -p "$folder"
          mkdir -p "$folder/assets"
          cp tray-launcher/target/release/codex-live-viewer-tray "$folder/ai-live-viewer-tray"
          cp codex-live-viewer.js viewer-ui.html README.md LICENSE "$folder/"
          cp assets/logo.svg "$folder/assets/logo.svg"
          # The companion Resume/Cancel run; the server finds it at plugin/scripts/.
          mkdir -p "$folder/plugin/.claude-plugin"
          cp -r plugin/scripts plugin/prompts plugin/schemas plugin/LICENSE plugin/NOTICE "$folder/plugin/"
          cp plugin/.claude-plugin/plugin.json "$folder/plugin/.claude-plugin/plugin.json"
          chmod +x "$folder/ai-live-viewer-tray"
          cd dist
          zip -r AI-Live-Viewer-Linux-x64.zip AI-Live-Viewer-Linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/AI-Live-Viewer-Linux-x64.zip

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
