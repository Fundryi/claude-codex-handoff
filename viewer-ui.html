<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Live Viewer</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #111720;
      --panel-2: #171e28;
      --hover: #1b2531;
      --selected: #16263a;
      --border: #293241;
      --fg: #e6edf3;
      --muted: #8c9bab;
      --faint: #637083;
      --blue: #67a8ff;
      --green: #4ac26b;
      --yellow: #e5b849;
      --red: #ff6b63;
      --purple: #c49cff;
      /* Actor colors: who sent a feed message. One meaning each, never a status color. */
      --you: #f28fbf;
      --claude: #d97757;
      --plugin: #b6cf6e;
      --codex: #45c4b0;
      --system: #8c9bab;
      --codex-lead: #9ae0d4; /* a lead agent writing to its child: Codex family, lighter, ring avatar */
      --sidebar-width: 340px;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      overflow: hidden;
      min-width: 0;
      font-size: 13px;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [role="separator"]:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
    .icon-button {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
    }
    .icon-button:hover { background: var(--hover); }
    .muted { color: var(--muted); }
    .mono { font-family: "Cascadia Code", Consolas, monospace; }

    #side {
      width: var(--sidebar-width);
      min-width: 240px;
      max-width: 55vw;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: none;
    }
    body.side-collapsed #side { display: none; }
    #brand {
      min-height: 57px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    #brand-mark {
      width: 30px;
      height: 30px;
      object-fit: contain;
      flex: none;
    }
    #brand-copy { min-width: 0; flex: 1; }
    #brand-title { font-size: 14px; font-weight: 650; letter-spacing: .1px; }
    #brand-subtitle { color: var(--muted); font-size: 11px; margin-top: 1px; }
    #resume-session-button { height: 32px; white-space: nowrap; }
    #connection {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    #connection-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--yellow);
    }
    #connection.connected #connection-dot { background: var(--green); }
    #connection.disconnected #connection-dot { background: var(--red); }

    #side-controls { padding: 10px 10px 8px; border-bottom: 1px solid var(--border); }
    #search {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--fg);
      background: var(--bg);
      padding: 8px 10px;
      font-size: 13px;
    }
    #search::placeholder { color: var(--faint); }
    [hidden] { display: none !important; }
    /* Tabs: one fixed row, 28 px. Chips: one small wrapping row inside the tab. */
    #tabs { display: flex; margin-top: 8px; border-bottom: 1px solid var(--border); }
    .tab-button {
      flex: 1;
      height: 28px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
    }
    .tab-button:hover { color: var(--fg); background: var(--hover); }
    .tab-button.on { color: #b9d8ff; border-bottom-color: var(--blue); font-weight: 600; }
    .tab-button .count { margin-left: 0; }
    #chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .chip-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
    }
    .tab-button, .chip-button, .toolbar-button {
      transition: color .14s ease, background-color .14s ease, border-color .14s ease;
    }
    .chip-button::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7b8794;
      flex: none;
    }
    .chip-button[data-chip="ALL"]::before, .chip-button[data-chip="RUNNING"]::before { background: var(--blue); }
    .chip-button[data-chip="RUNNING"].has-sessions::before {
      width: 9px;
      height: 9px;
      border: 2px solid var(--blue);
      border-top-color: transparent;
      background: transparent;
      animation: spin .8s linear infinite;
    }
    .chip-button[data-chip="WAITING"]::before { background: var(--yellow); }
    .chip-button[data-chip="ATTENTION"]::before { background: #ee964b; }
    .chip-button[data-chip="ANSWER"]::before { background: transparent; border: 1px solid #ee964b; }
    .chip-button[data-chip="FINISHED"]::before { background: var(--green); }
    .chip-button[data-chip="STOPPED"]::before { background: #7b8794; }
    .chip-button[data-chip="ARCHIVED"]::before { background: #9fb0c3; }
    .chip-button:hover { background: var(--hover); color: var(--fg); }
    .chip-button.on {
      border-color: #36577c;
      background: #172a40;
      color: #b9d8ff;
    }
    #open-elsewhere {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    #open-elsewhere-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
    #open-elsewhere-show { flex: none; border: 0; padding: 0 2px; background: transparent; color: var(--blue); cursor: pointer; font-size: 11px; }
    #open-elsewhere-show:hover { text-decoration: underline; }
    .count { opacity: .7; margin-left: auto; }
    #list { overflow-y: auto; min-height: 0; flex: 1; }
    .session {
      width: 100%;
      display: block;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-left: 3px solid transparent;
      background: transparent;
      padding: 7px 12px 7px 10px;
      cursor: pointer;
      transition: background-color .14s ease, border-color .14s ease;
    }
    .session:hover { background: var(--hover); }
    .session.selected { background: var(--selected); border-left-color: var(--blue); }
    .session.dismissed { opacity: .55; }
    /* Parent + child agents render as one bracketed group; loose sessions stay plain. */
    .session-group { border-left: 3px solid #7c6bd6; margin: 4px 0 4px 6px; border-radius: 0 6px 6px 0; background: rgba(124, 107, 214, .06); }
    .session-group .session { border-left-color: transparent; }
    .session-group .session.selected { border-left-color: var(--blue); }
    .session-group > .group-caption + .session { border-bottom-color: rgba(124, 107, 214, .35); }
    .session.child { position: relative; padding-left: 30px; }
    .session.child::before { content: ''; position: absolute; left: 12px; top: 0; bottom: 50%; width: 9px; border-left: 1px solid #7c6bd6; border-bottom: 1px solid #7c6bd6; border-radius: 0 0 0 4px; opacity: .8; }
    .session.child:not(:last-child)::after { content: ''; position: absolute; left: 12px; top: 50%; bottom: 0; border-left: 1px solid #7c6bd6; opacity: .8; }
    .session.child:last-child { border-bottom: 0; }
    .group-caption { padding: 4px 12px 2px; color: #b7a9ff; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    #home-view { padding: 4px 0 30px; }
    .home-heading {
      color: var(--faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      margin: 18px 0 8px;
    }
    .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
    .home-card, .home-finished {
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel);
      padding: 10px 12px;
      cursor: pointer;
      min-width: 0;
    }
    .home-card:hover, .home-finished:hover { background: var(--hover); }
    .home-card.attention { border-color: #f0a254; }
    .home-finished { display: block; width: 100%; margin-bottom: 6px; }
    .home-more { margin-top: 4px; }
    .history-caption {
      padding: 10px 12px 4px;
      color: var(--faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
    }
    .status.HISTORY { background: #20262f; color: #8c9bab; }
    .session-top { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .session-title {
      margin-top: 7px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-project, .session-last {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-last { display: none; }
    .row-open {
      width: 100%;
      display: block;
      border: 0;
      padding: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .job-actions { display: flex; gap: 6px; margin-top: 7px; }
    .job-actions button {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
    }
    .job-actions button:hover { background: var(--hover); color: var(--fg); }
    .match-hint { color: var(--faint); font-size: 10px; margin-top: 2px; }
    .search-count { padding: 6px 12px 2px; color: var(--muted); font-size: 11px; }
    .session-time { margin-left: auto; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .unread { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 7px var(--blue); }
    .status {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      transition: color .15s ease, background-color .15s ease;
    }
    .status.LIVE { background: #172f4d; color: #80bdff; }
    .status.LIVE::before {
      content: '';
      width: 8px;
      height: 8px;
      margin-right: 5px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .status.IDLE { background: #473a19; color: #f0cb6e; }
    .status.STALE { background: #4a2c12; color: #f0a254; }
    .status.DONE { background: #173923; color: #72dc8c; }
    .status.STOPPED { background: #262d38; color: #9fb0c3; }
    .status.NEEDS_ANSWER { background: transparent; border: 1px solid #ee964b; color: #ee964b; }
    .status.ARCHIVED { background: #262d38; color: #9fb0c3; }
    .status.FAST { background: #3d2a14; color: #ffb86b; }
    /* A handoff is Claude's: Claude's actor color and glyph, and no pill, so it never reads as a status. */
    .status.HANDOFF { background: transparent; color: var(--claude); padding: 2px 1px; }
    .status.HANDOFF::before { content: '\2733\FE0E'; margin-right: 4px; font-size: 10px; }
    .status.AGENT { background: #2a2440; color: #c9b6ff; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-list { padding: 30px 15px; text-align: center; color: var(--muted); font-size: 12px; }

    #splitter {
      width: 5px;
      flex: none;
      cursor: col-resize;
      background: var(--border);
      border: 0;
      padding: 0;
      touch-action: none;
    }
    #splitter:hover, #splitter.dragging { background: var(--blue); }
    body.side-collapsed #splitter { display: none; }

    #main { min-width: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #task-header {
      position: relative;
      padding: 11px 15px 10px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex: none;
    }
    #header-top { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
    #show-side { display: none; flex: none; }
    #side-backdrop { display: none; } /* the mobile drawer's backdrop; shown only in the 760px media query */
    body.side-collapsed #show-side { display: inline-grid; }
    #task-copy { flex: 1; min-width: 0; }
    #task-title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #task-title {
      font-weight: 650;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #task-meta { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 7px; color: var(--muted); font-size: 11px; }
    .meta-item { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta-button {
      border: 0;
      padding: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
    }
    .meta-button:hover { color: var(--blue); }
    #wait-reason {
      flex-basis: 100%;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      color: var(--yellow);
    }
    #wait-reason.STALE { color: #f0a254; }
    #header-actions { display: flex; align-items: center; gap: 6px; flex: none; }
    #auto-open-toggle {
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      padding: 0 10px;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }
    #auto-open-toggle:hover, #auto-open-toggle.on { color: var(--fg); background: var(--hover); }
    #action-menu {
      position: absolute;
      right: 14px;
      top: 48px;
      width: 210px;
      max-height: calc(100vh - 70px);
      overflow-y: auto;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-2);
      box-shadow: 0 12px 30px #0008;
      z-index: 5;
    }
    #context-menu {
      position: fixed;
      width: 210px;
      max-height: calc(100vh - 16px);
      overflow-y: auto;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-2);
      box-shadow: 0 12px 30px #0008;
      z-index: 30;
    }
    #action-menu button, #context-menu button {
      width: 100%;
      border: 0;
      border-radius: 5px;
      padding: 8px 9px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      font-size: 12px;
    }
    #action-menu button:hover, #context-menu button:hover { background: var(--hover); }
    #action-menu button.danger, #context-menu button.danger { color: #ff8f88; }
    .menu-group {
      padding: 7px 9px 3px;
      color: var(--faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
    }
    .menu-group:first-child { padding-top: 3px; }
    #job-modal-runs-field { margin-bottom: 10px; }
    #process-panel {
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      max-height: 180px;
      overflow-y: auto;
    }
    .process { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; overflow-wrap: anywhere; }
    .kill-button {
      border: 0;
      border-radius: 5px;
      padding: 3px 7px;
      background: #6d2925;
      color: #ffd0cc;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      flex: none;
    }
    #stop-modal, #job-modal, #control-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #000a;
      display: grid;
      place-items: center;
    }
    #stop-modal-box, #job-modal-box, #control-modal-box {
      width: min(92vw, 560px);
      max-height: 84vh;
      overflow-y: auto;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 18px 50px #000c;
    }
    #stop-modal-box h2, #job-modal-box h2, #control-modal-box h2 { margin: 0 0 12px; font-size: 14px; }
    .stop-modal-row { display: flex; gap: 10px; margin-bottom: 6px; font-size: 12px; }
    .stop-modal-label { color: var(--muted); flex: none; width: 70px; }
    .stop-modal-value { min-width: 0; overflow-wrap: anywhere; }
    .stop-modal-warning {
      border-radius: 7px;
      padding: 8px 10px;
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.5;
    }
    .stop-modal-warning.red { background: #4a1512; color: #ffb3ad; border: 1px solid #7a2a24; }
    .stop-modal-warning.yellow { background: #453a14; color: #f0cb6e; border: 1px solid #6d5a1e; }
    .stop-modal-warning.ok { background: #14331e; color: #8fdca4; border: 1px solid #245c36; }
    #stop-modal-actions, #job-modal-actions, #control-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    #stop-modal-actions button, #job-modal-actions button, #control-modal-actions button {
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 12px;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
    }
    #stop-modal-actions button:hover, #job-modal-actions button:hover, #control-modal-actions button:hover { background: var(--hover); }
    #stop-modal-confirm { background: #6d2925; border-color: #8a3a34; color: #ffd0cc; font-weight: 700; }
    #stop-modal-confirm:disabled { opacity: .6; cursor: default; }
    #job-modal-box { width: min(92vw, 760px); }
    #job-modal-result {
      max-height: 55vh;
      overflow: auto;
      margin: 12px 0 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    #job-modal-result > :first-child { margin-top: 0; }
    #job-modal-result > :last-child { margin-bottom: 0; }
    #control-modal-box { width: min(92vw, 640px); }
    #control-modal-body { display: grid; gap: 11px; }
    .control-field { display: grid; gap: 5px; color: var(--muted); font-size: 11px; }
    .control-field input:not([type="checkbox"]), .control-field select, .control-field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 9px;
      color: var(--fg);
      background: var(--bg);
    }
    .control-field textarea { min-height: 90px; resize: vertical; }
    .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .control-checkbox { display: flex; align-items: center; gap: 7px; color: var(--fg); font-size: 12px; }
    #control-modal-error { min-height: 18px; margin-top: 10px; color: #ff9b95; font-size: 12px; white-space: pre-wrap; }
    #control-modal-confirm { background: #17375a; border-color: #36577c; color: #c2ddff; font-weight: 700; }
    #control-modal-confirm.danger { background: #6d2925; border-color: #8a3a34; color: #ffd0cc; }
    #control-modal-confirm:disabled { opacity: .6; cursor: default; }

    #feed-toolbar {
      min-height: 43px;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      border-bottom: 1px solid var(--border);
      background: #0e141c;
      flex: none;
    }
    #feed-toolbar .spacer { flex: 1; }
    .toolbar-button {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }
    .toolbar-button:hover, .toolbar-button.on { background: var(--hover); color: var(--fg); }
    #legend { display: flex; align-items: center; gap: 4px 14px; min-width: 0; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .legend-title { color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; cursor: default; }
    .legend-item::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--actor); flex: none; }
    .legend-item.actor-work::before { background: transparent; box-shadow: inset 0 0 0 2px var(--codex); }
    .legend-item.actor-system::before { background: transparent; box-shadow: none; border: 1px dashed var(--system); width: 7px; height: 7px; }
    .started-by { display: inline-flex; align-items: center; gap: 6px; }
    .started-by b { color: var(--actor); font-weight: 650; }
    #result-card { flex: none; padding: 10px clamp(14px, 3vw, 36px); border-bottom: 1px solid var(--border); background: #0e141c; }
    .result-card-box { width: min(100%, 1080px); margin: 0 auto; border: 1px solid var(--border); border-left: 3px solid var(--codex); border-radius: 7px; background: var(--panel); min-width: 0; }
    .result-card-head { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 4px; }
    .result-card-toggle { display: flex; align-items: center; gap: 7px; border: 0; border-radius: 6px; padding: 4px 6px; background: transparent; color: var(--fg); cursor: pointer; font-size: 12px; font-weight: 600; transition: background-color 160ms; }
    .result-card-toggle:hover { background: var(--hover); }
    .result-card-caret { color: var(--muted); font-size: 10px; width: 10px; }
    .result-card-runs { color: var(--muted); font-size: 11px; }
    .result-card-head .spacer { flex: 1; }
    .result-card-body { max-height: 38vh; overflow: auto; padding: 2px 14px 12px; border-top: 1px solid var(--border); }
    .result-section { margin-top: 10px; min-width: 0; }
    .result-section-title { margin: 0 0 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .45px; text-transform: uppercase; }
    .result-section.question { margin-top: 12px; padding: 8px 12px 10px; border: 1px solid color-mix(in srgb, var(--you) 45%, transparent); border-radius: 7px; background: color-mix(in srgb, var(--you) 7%, var(--panel)); }
    .result-section.question .result-section-title { color: var(--you); }
    .result-section-body { overflow-wrap: anywhere; word-break: break-word; line-height: 1.55; font-size: 13px; }
    .result-section-body > :first-child { margin-top: 0; }
    .result-section-body > :last-child { margin-bottom: 0; }
    .result-section-body code { font: 11px "Cascadia Code", Consolas, monospace; background: #0e141c; padding: 1px 4px; border-radius: 4px; }
    .result-card-note { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .answer-box { margin-top: 10px; display: grid; gap: 7px; }
    .answer-box textarea { width: 100%; min-height: 70px; resize: vertical; border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; color: var(--fg); background: var(--bg); }
    .answer-box-actions { display: flex; justify-content: flex-end; }
    .answer-box-actions button { border: 1px solid #36577c; border-radius: 6px; padding: 6px 11px; background: #17375a; color: #c2ddff; font-size: 11px; font-weight: 700; cursor: pointer; }
    .answer-box-actions button:disabled { opacity: .5; cursor: default; }
    /* Jump to latest takes its own row under the feed, so it never covers a card or its time. */
    #feed-wrap { min-height: 0; flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    #feed {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 11px clamp(14px, 3vw, 36px) 50px;
      scroll-behavior: smooth;
    }
    #feed-inner { width: min(100%, 1080px); margin: 0 auto; min-width: 0; }
    #jump-latest {
      flex: none;
      align-self: center;
      margin: 6px 0 8px;
      border: 1px solid #416891;
      border-radius: 999px;
      background: #172b42;
      color: #c2ddff;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 11px;
    }
    /* Feed grammar: messages are cards with a sender -> receiver header in the actor's color;
       Codex work is a collapsed activity log on a teal rail; System and Plugin text is quiet. */
    .actor-you { --actor: var(--you); }
    .actor-relay { --actor: var(--you); }
    .actor-claude { --actor: var(--claude); }
    .actor-plugin { --actor: var(--plugin); }
    .actor-codex, .actor-work { --actor: var(--codex); }
    .actor-system { --actor: var(--system); }
    .actor-codex-lead { --actor: var(--codex-lead); }
    .actor-codex-lead .avatar, .avatar.lead { background: transparent; color: var(--codex-lead); box-shadow: inset 0 0 0 1.5px var(--codex-lead); }
    .msg-tag.neutral { --actor: var(--system); }
    .avatar {
      width: 20px;
      height: 20px;
      flex: none;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: var(--actor);
      color: #0b0f14;
      font: 700 11px/1 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }
    .avatar.mono { font: 700 9px/1 "Cascadia Code", Consolas, monospace; letter-spacing: -.5px; }
    .avatar.small { width: 16px; height: 16px; font-size: 9px; }
    .avatar.small.mono { font-size: 8px; }
    .actor-relay > .msg-head .avatar, .avatar.ring { background: transparent; color: var(--actor); box-shadow: inset 0 0 0 1.5px var(--actor); }
    .actor-relay > .msg-head .avatar { box-shadow: none; border: 1.5px dashed var(--actor); }
    .who { color: var(--actor); font-weight: 650; }
    .route-arrow { color: var(--faint); font-size: 12px; }
    .msg {
      min-width: 0;
      margin: 12px 0 8px;
      padding: 9px 14px 11px;
      border: 1px solid color-mix(in srgb, var(--actor) 22%, var(--border));
      border-left: 3px solid var(--actor);
      border-radius: 8px;
      background: color-mix(in srgb, var(--actor) 7%, var(--panel));
    }
    .msg.actor-codex { background: var(--panel); }
    .msg-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; margin-bottom: 6px; font-size: 12px; }
    .msg-tag {
      border: 1px solid color-mix(in srgb, var(--actor) 45%, transparent);
      border-radius: 999px;
      padding: 0 7px;
      color: var(--actor);
      font-size: 10px;
      font-weight: 600;
      line-height: 16px;
      white-space: nowrap;
    }
    .msg-time { margin-left: auto; color: var(--faint); font-size: 10px; white-space: nowrap; }
    details.msg-more > summary { cursor: pointer; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    details.msg-more > summary:hover { color: var(--fg); }
    details.msg-more[open] > summary { margin-bottom: 6px; }
    .ask {
      margin-top: 10px;
      padding: 8px 12px 9px;
      border: 1px solid color-mix(in srgb, var(--you) 45%, transparent);
      border-radius: 7px;
      background: color-mix(in srgb, var(--you) 8%, var(--panel));
    }
    .ask-title { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; color: var(--you); font-size: 10px; font-weight: 700; letter-spacing: .45px; text-transform: uppercase; }
    details.part {
      margin-top: 10px;
      border-top: 1px dashed color-mix(in srgb, var(--actor) 35%, var(--border));
      padding-top: 7px;
    }
    details.part > summary, details.quiet > summary, details.technical > summary, details.work > summary {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      cursor: pointer;
      list-style: none;
      white-space: nowrap;
      overflow: hidden;
    }
    details > summary::-webkit-details-marker { display: none; }
    .caret { flex: none; width: 8px; color: var(--faint); font-size: 9px; transition: transform .14s ease; }
    details[open] > summary > .caret { transform: rotate(90deg); }
    .sum-label { flex: none; color: var(--actor, var(--muted)); font-size: 11px; font-weight: 650; }
    .sum-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 11px; }
    .sum-time { flex: none; margin-left: auto; padding-left: 8px; color: var(--faint); font-size: 10px; }
    details.part > summary { color: var(--muted); font-size: 11px; }
    details.part pre, details.quiet pre {
      margin: 7px 0 0;
      max-height: 360px;
      overflow: auto;
      padding: 8px 10px;
      border-radius: 6px;
      background: #0b1016;
      color: #aebccb;
      font: 11px/1.5 "Cascadia Code", Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    details.quiet {
      margin: 6px 0;
      padding: 5px 10px;
      border: 1px dashed #2a3340;
      border-radius: 7px;
      background: transparent;
    }
    details.quiet[open] { background: #0e141c; }
    .quiet-step { margin-top: 8px; }
    .quiet-step-head { display: flex; gap: 8px; color: var(--muted); font-size: 10px; }
    .quiet-step-head b { color: var(--fg); font-weight: 600; }
    details.work {
      margin: 2px 0 2px 9px;
      padding: 2px 0 2px 14px;
      border-left: 2px solid color-mix(in srgb, var(--codex) 40%, transparent);
    }
    details.work > summary { padding: 4px 0; }
    .work-list { display: grid; gap: 4px; padding: 3px 0 6px; }
    .marker { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: var(--faint); font-size: 10px; letter-spacing: .3px; }
    .marker::before, .marker::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .marker.done { color: var(--green); }
    .marker.err { color: var(--red); }
    .working { display: flex; align-items: center; gap: 8px; margin: 12px 0 0 9px; color: #80bdff; font-size: 11px; min-width: 0; }
    .working-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .working::before {
      content: '';
      flex: none;
      width: 9px;
      height: 9px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .event-body, .msg-body {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.55;
      font-size: 13px;
    }
    .event-body > :first-child, .msg-body > :first-child { margin-top: 0; }
    .event-body > :last-child, .msg-body > :last-child { margin-bottom: 0; }
    .md-h1, .md-h2, .md-h3 { margin: 10px 0 4px; font-weight: 650; color: var(--fg); }
    .md-h1 { font-size: 15px; }
    .md-h2 { font-size: 14px; }
    .md-h3 { font-size: 13px; }
    .md-p { margin: 6px 0; }
    .md-list { margin: 6px 0; padding-left: 20px; }
    .md-list li { margin: 2px 0; }
    .md-quote { margin: 6px 0; padding: 2px 10px; border-left: 2px solid var(--border); color: var(--muted); }
    .md-code { margin: 8px 0; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; background: #0e141c; }
    .md-code-lang { padding: 4px 10px; color: var(--muted); font: 10px/1.4 "Cascadia Code", Consolas, monospace; border-bottom: 1px solid var(--border); }
    .md-code pre { margin: 0; padding: 10px; color: #b8c5d1; font: 11px/1.55 "Cascadia Code", Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .event-body code, .msg-body code, .md-quote code { font: 11px "Cascadia Code", Consolas, monospace; background: #0e141c; padding: 1px 4px; border-radius: 4px; }
    .msg-body .md-code { background: #0b1016; }
    .thinkgroup-step { padding: 8px 10px; border-top: 1px solid var(--border); }
    .thinkgroup-step:first-of-type { border-top: none; }
    .thinkgroup-step-time { color: var(--faint); font-size: 10px; margin-bottom: 3px; }
    .thinkgroup-step .event-body { color: #c3cdd8; font-size: 12px; }
    details.technical {
      border: 1px solid #222b37;
      border-radius: 6px;
      background: #0e141c;
      overflow: hidden;
    }
    details.technical[open] { border-color: var(--border); }
    details.technical > summary { padding: 5px 9px; }
    details.technical > summary:hover, details.quiet > summary:hover .sum-text, details.work > summary:hover .sum-text { color: var(--fg); }
    .step-kind { flex: none; min-width: 62px; color: color-mix(in srgb, var(--codex) 80%, var(--muted)); font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; }
    .step-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #b8c5d1; font: 11px "Cascadia Code", Consolas, monospace; }
    details.technical pre {
      margin: 0;
      border-top: 1px solid var(--border);
      padding: 10px;
      color: #b8c5d1;
      font: 11px/1.55 "Cascadia Code", Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .feed-empty { color: var(--muted); text-align: center; padding: 70px 25px; }
    .feed-empty strong { display: block; color: var(--fg); font-size: 15px; margin-bottom: 7px; }
    .load-earlier {
      width: 100%;
      margin: 0 0 16px;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 10px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }
    .load-earlier:hover { background: var(--hover); color: var(--fg); }
    @media (max-width: 760px) {
      #side {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        width: min(88vw, 360px) !important;
        max-width: none;
        min-width: 0;
        transform: translateX(-102%);
        transition: transform .18s ease;
        box-shadow: 15px 0 40px #000a;
      }
      body.mobile-side-open #side { transform: translateX(0); display: flex; }
      body.side-collapsed #side { display: flex; }
      #splitter { display: none !important; }
      #show-side { display: inline-grid; }
      #hide-side { display: inline-grid; }
      #task-header { padding-left: 10px; padding-right: 10px; }
      #task-meta { gap: 4px 9px; }
      #feed-toolbar { padding-left: 8px; padding-right: 8px; overflow-x: auto; }
      #feed, #result-card { padding-left: 12px; padding-right: 12px; }
      .control-grid { grid-template-columns: 1fr; }
      #chips { flex-wrap: nowrap; overflow-x: auto; }
      #side-backdrop { display: none; position: fixed; inset: 0; z-index: 19; background: #000a; }
      body.mobile-side-open #side-backdrop { display: block; }
      #task-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .meta-item { white-space: normal; overflow: visible; text-overflow: clip; }
      .legend-title { display: none; }
      #legend { gap: 12px; }
      .result-section.question { padding: 0; border: 0; background: none; }
      .result-card-body .answer-box { position: sticky; bottom: -12px; margin: 10px -14px -12px; padding: 10px 14px 12px; background: var(--panel); border-top: 1px solid var(--border); }
    }

<body>
  <aside id="side" aria-label="Codex sessions">
    <div id="brand">
      <img id="brand-mark" src="/logo.svg" alt="">
      <div id="brand-copy">
        <div id="brand-title">Codex Live Viewer</div>
        <div id="brand-subtitle"><span id="connection"><span id="connection-dot"></span><span id="connection-text">Connecting</span></span></div>
      </div>
      <button id="hide-side" class="icon-button" type="button" title="Collapse session list" aria-label="Collapse session list">&#x2039;</button>
    </div>
    <div id="side-controls">
      <input id="search" type="search" placeholder="Search tasks, projects, or IDs" aria-label="Search sessions">
      <div id="tabs" aria-label="Views"></div>
      <div id="chips" aria-label="Filter this view"></div>
    </div>
    <div id="open-elsewhere" hidden>Open: <span id="open-elsewhere-title"></span> (not in this view) &#xB7; <button id="open-elsewhere-show" type="button">Show</button></div>
    <div id="list"></div>
  </aside>

  <div id="side-backdrop" aria-hidden="true"></div>

  <div id="splitter" role="separator" aria-label="Resize session list" aria-orientation="vertical" tabindex="0"></div>

  <main id="main">
    <header id="task-header">
      <div id="header-top">
        <button id="show-side" class="icon-button" type="button" title="Show session list" aria-label="Show session list">&#x2630;</button>
        <div id="task-copy">
          <div id="task-title-row"><span id="task-status" class="status DONE" hidden></span><span id="task-handoff" class="status HANDOFF" hidden>Handoff</span><span id="task-fast" class="status FAST" title="Priority processing (fast tier)" hidden>FAST</span><span id="task-title">Select a task</span></div>
          <div id="task-meta"><span class="meta-item">Running tasks are selected automatically</span></div>
        </div>
        <div id="header-actions">
          <button id="resume-session-button" class="toolbar-button" type="button" hidden>Resume</button>
          <button id="auto-open-toggle" type="button" role="switch" aria-pressed="false" title="Automatically open the newest running task" hidden>Auto-open new runs: Off</button>
          <button id="actions-button" class="icon-button" type="button" title="Task actions" aria-label="Task actions" aria-expanded="false">&#x22EF;</button>
        </div>
      </div>
      <div id="action-menu" role="menu" hidden></div>
      <div id="process-panel" hidden></div>
    </header>

    <div id="feed-toolbar">
      <div id="legend" role="note" aria-label="Who's who in the feed">
        <span class="legend-title">Who's who</span>
        <span class="legend-item actor-you" title="You: a message you typed, or your answer relayed through Claude or the answer box">You</span>
        <span class="legend-item actor-claude" title="Claude: a handoff prompt, or an answer Claude gave by itself">Claude</span>
        <span class="legend-item actor-plugin" title="Plugin: the return format the codex plugin adds to every handoff">Plugin</span>
        <span class="legend-item actor-codex" title="Codex: replies, and questions it asks you. In a child agent's session, the lead agent's messages show as Codex (lead), in a lighter teal with a ring avatar">Codex</span>
        <span class="legend-item actor-work" title="Codex work: thinking, commands, output, patches and tools">Codex work</span>
        <span class="legend-item actor-system" title="System: injected context and hook text, collapsed">System</span>
      </div>
    </div>

    <section id="result-card" aria-label="Handoff result" hidden></section>

    <div id="feed-wrap">
      <div id="feed"><div id="feed-inner"></div></div>
      <button id="jump-latest" type="button" hidden>Jump to latest</button>
    </div>
  </main>

  <div id="stop-modal" hidden>
    <div id="stop-modal-box" role="dialog" aria-modal="true" aria-labelledby="stop-modal-title">
      <h2 id="stop-modal-title">Stop Codex process?</h2>
      <div id="stop-modal-body"></div>
      <div id="stop-modal-actions">
        <button id="stop-modal-cancel" type="button">Cancel</button>
        <button id="stop-modal-confirm" type="button">Stop process</button>
      </div>
    </div>
  </div>

  <div id="job-modal" hidden>
    <div id="job-modal-box" role="dialog" aria-modal="true" aria-labelledby="job-modal-title">
      <h2 id="job-modal-title">Job result</h2>

      <div id="job-modal-meta"></div>
      <div id="job-modal-result"></div>
      <div id="job-modal-actions">
        <button id="job-modal-resume" type="button" hidden>Resume</button>
        <button id="job-modal-close" type="button">Close</button>
      </div>
    </div>
  </div>

  <div id="context-menu" role="menu" hidden></div>

  <div id="control-modal" hidden>
    <div id="control-modal-box" role="dialog" aria-modal="true" aria-labelledby="control-modal-title">
      <h2 id="control-modal-title">Codex action</h2>

        <div id="control-modal-body"></div>
        <div id="control-modal-error" role="status" aria-live="polite"></div>
        <div id="control-modal-actions">
          <button id="control-modal-cancel" type="button">Back</button>
          <button id="control-modal-confirm" type="submit">Continue</button>
        </div>
      </form>
    </div>

  <script>
    'use strict';

    var STORAGE_KEY = 'codex-live-viewer-ui-v1';

    };

    var side = document.getElementById('side');

    var list = document.getElementById('list');
    var tabsBar = document.getElementById('tabs');
    var chipsBar = document.getElementById('chips');
    var openElsewhere = document.getElementById('open-elsewhere');
    var openElsewhereTitle = document.getElementById('open-elsewhere-title');
    var search = document.getElementById('search');
    var feed = document.getElementById('feed');
    var feedInner = document.getElementById('feed-inner');
    var resultCard = document.getElementById('result-card');

    var jobModalRuns = document.getElementById('job-modal-runs');

    var controlModalBody = document.getElementById('control-modal-body');
    var controlModalError = document.getElementById('control-modal-error');
    var controlModalConfirm = document.getElementById('control-modal-confirm');
    var controlModalCancel = document.getElementById('control-modal-cancel');
    var resumeSessionButton = document.getElementById('resume-session-button');
    var controlAction = null;
    var pendingKillPid = null;
    var autoOpenToggle = document.getElementById('auto-open-toggle');
    var connection = document.getElementById('connection');
