      return [projectName(row.project), session.model || job.model, job.effort || session.effort, tokens].filter(Boolean).join(' · ');
    }
    // The session's wait/stop reason, only while the session (not a job) decides the row status.
    function rowReason(row) {
      if (!row.session || (row.job && rowStatus(row.session, null) !== row.status)) return '';
      return waitReason(row.session);
    }
    // Everything the 3-line row leaves out: full path, thread, sandbox, reason, handoff detail.
    function rowTooltip(row, now) {
      var session = row.session;
      var job = row.job;
      var lines = [row.title, row.project];
      if (row.threadId) lines.push('thread: ' + row.threadId);
      if (session && session.sandbox) lines.push('sandbox: ' + session.sandbox);
      lines.push(rowReason(row));
      if (job) lines.push('Handoff: ' + (jobDetailLine(job, now) || job.status || job.live || ''));
      if (row.olderJobs) lines.push(row.olderJobs + (row.olderJobs === 1 ? ' earlier run' : ' earlier runs') + ' on this thread');
      return lines.filter(Boolean).join('\n');
    }
    // Next index for arrow-key roving focus within a row of buttons (tabs, chips). Wraps around.
    function rovingFocusIndex(currentIndex, itemCount, key) {
      if (itemCount <= 0) return currentIndex;
      if (key === 'Home') return 0;
      if (key === 'End') return itemCount - 1;
      if (key === 'ArrowRight') return (currentIndex + 1) % itemCount;
      if (key === 'ArrowLeft') return (currentIndex - 1 + itemCount) % itemCount;
      return currentIndex;
    }
    // Whether the reader holds a non-empty text selection that starts or ends inside container.
    // A feed rebuild waits while this is true: it would wipe the selection.
    function selectionInside(selection, container) {
      if (!selection || !selection.rangeCount || selection.isCollapsed || !String(selection).length) return false;
      return container.contains(selection.anchorNode) || container.contains(selection.focusNode);
    }
    // Whether an element is a text-entry field '/' must not steal a keystroke from.
    function isEditableElement(el) {
      if (!el) return false;
      if (el.isContentEditable) return true;
      return ['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName);
    }
    function setConnection(state, label) {
      connection.className = state;
      connectionText.textContent = label;
    }

    function applyPrefs() {
      var savedWidth = Math.max(240, Number(prefs.sideWidth) || 340);
      prefs.sideWidth = window.innerWidth > 760
        ? clamp(savedWidth, 240, Math.max(260, window.innerWidth * .55))
        : savedWidth;
      document.documentElement.style.setProperty('--sidebar-width', prefs.sideWidth + 'px');
      document.body.classList.toggle('side-collapsed', !!prefs.sideCollapsed);
      search.value = prefs.query || '';
      autoOpenToggle.classList.toggle('on', !!prefs.autoFollow);
      autoOpenToggle.setAttribute('aria-pressed', prefs.autoFollow ? 'true' : 'false');
      autoOpenToggle.textContent = 'Auto-open new runs: ' + (prefs.autoFollow ? 'On' : 'Off');
    }

    function currentRows() { return buildRows(sessions, jobs); }
    // The Now overview shows whenever no task is open, or the user explicitly asked for it
    // (prefs.home, set by re-clicking the active Now tab; cleared by picking any task or view).
    function showOverview() { return prefs.home || !currentSession(); }

    function viewButton(className, label, count, on) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = className + (on ? ' on' : '');
      button.setAttribute('aria-pressed', on ? 'true' : 'false');
      button.append(document.createTextNode(label + ' '));
      var badge = document.createElement('span');
      badge.className = 'count';
      badge.textContent = count;
      button.appendChild(badge);
      return button;
    }

    function renderFilters() {
      var counts = viewCounts(currentRows(), prefs.dismissed);
      var perTab = tabCounts(counts);
      var signature = JSON.stringify([prefs.tab, prefs.chip, counts]);
      if (signature === lastFilterSignature) return;
      lastFilterSignature = signature;
      tabsBar.textContent = '';
      Object.keys(TABS).forEach(function (tab) {
        var button = viewButton('tab-button', VIEW_LABELS[tab], '(' + perTab[tab] + ')', prefs.tab === tab);
        button.dataset.tab = tab;
        button.addEventListener('click', function () {
          // Clicking the already-active Now tab opens the overview instead of re-picking a chip.
          if (tab === 'NOW' && prefs.tab === 'NOW' && !prefs.home) {
            prefs.home = true;
            lastHomeSignature = '';
            savePrefs();
            applyPrefs();
            renderList();
            renderHeader();
            renderFeed();
            return;
          }
          chooseView(tab, prefs.tab === tab ? prefs.chip : TABS[tab][0]);
        });
        tabsBar.appendChild(button);
      });
      chipsBar.textContent = '';
      TABS[prefs.tab].forEach(function (chip) {
        var count = counts[prefs.tab][chip];
        var button = viewButton('chip-button' + (chip === 'RUNNING' && count > 0 ? ' has-sessions' : ''), VIEW_LABELS[chip], count, prefs.chip === chip);
        button.dataset.chip = chip;
        button.addEventListener('click', function () { chooseView(prefs.tab, chip); });
        chipsBar.appendChild(button);
      });
    }

    function chooseView(tab, chip) {
      prefs.tab = tab;
      prefs.chip = chip;
      prefs.autoFollow = false;
      prefs.home = false;
      savePrefs();
      applyPrefs();
      renderFilters();
      renderList();
      renderHeader();
      renderFeed();
      if (tab === 'HANDOFFS') refreshJobs();
    }

    // previousStatus: the selected row's status before the update. Handoffs/All stays put
    // like the old Jobs filter; History/Everything always shows the row anyway.
    function followSelectedStatus(previousStatus) {
      var row = findRow(currentRows(), selected);
      if (!row || !previousStatus || row.status === previousStatus) return;
      if ((prefs.tab === 'HANDOFFS' && prefs.chip === 'ALL') || rowInView(row, prefs.tab, prefs.chip, prefs.dismissed)) return;
      Object.assign(prefs, viewContaining(row, prefs.tab, prefs.chip, prefs.dismissed));
      savePrefs();
    }

    // The Auto-open toggle lives on the Now overview, where followRunningSession stands down.
    // Turning it on leaves the overview and opens the running task now, as Follow newest did.
    function setAutoOpen(on, running) {
      prefs.autoFollow = on;
      if (on) {
        prefs.home = false;
        followRunningSession(running);
      }
      savePrefs();
    }

    function followRunningSession(running) {
      if (prefs.home) return;
      if (!prefs.autoFollow || !running) return;
      var row = findRow(currentRows(), running.id);
      if (row && !rowInView(row, prefs.tab, prefs.chip, prefs.dismissed)) {
        Object.assign(prefs, viewContaining(row, 'NOW', 'RUNNING', prefs.dismissed));
      }
      if (running.id !== selected) selectSession(running.id, false);
      else savePrefs();
    }

    function renderList() {
      var rows = currentRows();
      var query = String(prefs.query || '').trim();
      var hints = {};
      var shown = rows.filter(function (row) {
        if (!rowInView(row, prefs.tab, prefs.chip, prefs.dismissed)) return false;
        var hint = rowMatch(row, query);
        hints[row.id] = hint;
        return hint !== null;
      });
      var openRow = selected ? findRow(rows, selected) : null;
      // The overview hides the open task, so there is nothing to point at while it shows.
      var openHidden = !showOverview() && !!openRow && !rowInView(openRow, prefs.tab, prefs.chip, prefs.dismissed);
      var openTitle = openHidden ? sessionTitle(currentSession(), jobs) : '';
      // Only what a row shows: whole rows carry quietMs, which changes on every broadcast.
      function rowKey(row) {
        var session = row.session || {};
        var job = row.job || {};
        return [row.id, row.status, row.title, row.project, Math.floor(row.updatedMs / 10000), row.olderJobs, session.model, session.tokensUsed,
          session.agentNickname, job.id, job.live, job.threadId, job.model, job.effort, job.needsDecision, row.children.map(rowKey)];
      }
      var signature = JSON.stringify([
        prefs.tab,
        prefs.chip,
        query,
        selected,
        openTitle,
        Math.floor(Date.now() / 10000),
        shown.map(rowKey),
        hints,
        Array.from(unread),
        prefs.dismissed,
        historyResults.map(function (entry) { return entry.id; })
      ]);
      if (signature === lastListSignature) return;
      lastListSignature = signature;
      openElsewhere.hidden = !openHidden;
      openElsewhereTitle.textContent = openTitle;
      openElsewhereTitle.title = openTitle;
      list.textContent = '';
      if (query) {
        var resultCount = document.createElement('div');
        resultCount.className = 'search-count';
        resultCount.textContent = shown.length + (shown.length === 1 ? ' result' : ' results');
        list.appendChild(resultCount);
      }
      shown.forEach(function (row) {
        var element = rowElement(row, 0, hints[row.id]);
        if (!row.children.length) { list.appendChild(element); return; }
        var group = document.createElement('div');
        group.className = 'session-group';
        var caption = document.createElement('div');
        caption.className = 'group-caption';
        caption.textContent = 'Agent team · ' + (row.children.length + 1);
        group.append(caption, element);
        row.children.forEach(function (kid) { group.appendChild(rowElement(kid, 1, '')); });
        list.appendChild(group);
      });

      if (!shown.length) {
        var empty = document.createElement('div');
        empty.className = 'empty-list';
        empty.textContent = !rows.length ? 'Waiting for Codex sessions…'
          : query ? 'No tasks match this search.' : 'No tasks match this filter.';
        list.appendChild(empty);
      }
      var history = query
        ? mergeHistoryResults(historyResults, shown.map(function (row) { return row.id; }))
        : [];
      if (history.length) {
        var caption = document.createElement('div');
        caption.className = 'history-caption';
        caption.textContent = 'History — older sessions (' + history.length + ')';
        list.appendChild(caption);
        history.forEach(function (entry) {
          var row = document.createElement('button');
          row.type = 'button';
          row.className = 'session';
          var top = document.createElement('div');
          top.className = 'session-top';
          var badge = document.createElement('span');
          badge.className = 'status ' + (entry.archived ? 'ARCHIVED' : 'HISTORY');
          badge.textContent = entry.archived ? 'Archived' : 'History';
          badge.title = 'Not in the live list. Click to load this session.';
          top.appendChild(badge);
          var time = document.createElement('span');
          time.className = 'session-time';
          time.textContent = relativeTime(entry.mtimeMs);
          top.appendChild(time);
          var title = document.createElement('div');
          title.className = 'session-title';
          title.textContent = entry.title || 'Untitled Codex task';
          var project = document.createElement('div');
          project.className = 'session-project';
          project.textContent = projectName(entry.cwd);
          project.title = entry.cwd || '';
          row.append(top, title, project);
          row.addEventListener('click', function () { openHistorySession(entry.id); });
          list.appendChild(row);
        });
      }
    }

    function statusChip(className, text, title) {
      var chip = document.createElement('span');
      chip.className = 'status ' + className;
      chip.textContent = text;
      chip.title = title;
      return chip;
    }

    // One list row: 3 lines (badges / title / project · model · effort · tokens), detail in the tooltip.
    function rowElement(row, depth, hint) {
      var session = row.session;
      var job = row.job;
      var element = document.createElement('div');
      element.className = 'session' + (depth ? ' child' : '') + (row.id === selected ? ' selected' : '') + (isDismissed(row.id) ? ' dismissed' : '');
      var open = document.createElement('button');
      open.type = 'button';
      open.className = 'row-open';
      open.setAttribute('aria-pressed', row.id === selected ? 'true' : 'false');
      open.title = rowTooltip(row, Date.now());

      var top = document.createElement('div');
      top.className = 'session-top';
      var badgeClass = rowBadge(row.status);
      top.appendChild(statusChip(badgeClass, STATUS[badgeClass].label, rowReason(row) || STATUS[badgeClass].help));
      if (job) {
        top.appendChild(statusChip('HANDOFF', 'Handoff', 'Handoff from Claude to Codex' + (row.olderJobs ? ' · ' + (row.olderJobs + 1) + ' runs on this thread' : '')));
      }
      if (row.fast) top.appendChild(fastChip());
      if (row.needsAnswer) top.appendChild(statusChip('NEEDS_ANSWER', '?', 'Codex asked: ' + firstLine(job.needsDecision, 200)));
      if (depth) top.appendChild(agentChip(session.agentNickname || 'agent'));
      else if (row.children.length) top.appendChild(agentChip('lead'));
      if (unread.has(row.id)) {
        var marker = document.createElement('span');
        marker.className = 'unread';
        marker.title = 'New activity';
        top.appendChild(marker);
      }
      var time = document.createElement('span');
      time.className = 'session-time';
      time.textContent = relativeTime(row.updatedMs);
      top.appendChild(time);

      var title = document.createElement('div');
      title.className = 'session-title';
      title.textContent = row.title;
      var meta = document.createElement('div');
      meta.className = 'session-project';
      meta.textContent = rowMetaLine(row);
      open.append(top, title, meta);
      if (hint) {
        var matched = document.createElement('div');
        matched.className = 'match-hint';
        matched.textContent = 'matched: ' + hint;
        open.appendChild(matched);
      }
      open.addEventListener('click', function () {
        if (session) selectSession(session.id, true);
        else openJob(job);
      });
      element.addEventListener('contextmenu', function (event) { openContextMenu(event, row); });
      element.appendChild(open);

      // Inline Resume for a dead or failed handoff; Cancel job lives in the task menus.
      var target = job ? resumeTarget(row) : null;
      if (target) {
        var actions = document.createElement('div');
        actions.className = 'job-actions';
        var resume = document.createElement('button');
        resume.type = 'button';
        resume.textContent = 'Resume';
        resume.addEventListener('click', function () { openResumeModal(target, row.title); });
        actions.appendChild(resume);
        element.appendChild(actions);
      }
      return element;
    }

    // The open task's row (child agents included). A session the list does not draw
    // (a grandchild agent) still gets a row of its own.
    function selectedRow() {
      var session = currentSession();
      if (!session) return null;
      // By id, never [0]: a newer job on another thread can sort first in the one-session build.
      return rowById(currentRows(), session.id) || rowById(buildRows([session], jobs), session.id);
    }

    function closeActionMenu() {
      actionMenu.hidden = true;
      actionsButton.setAttribute('aria-expanded', 'false');
    }

    // Line 1: status, Handoff, FAST, title. Line 2: meta (click copies the thread id), time.
    // Line 3: the reason line, only when there is one.
    function renderHeader() {
      var overview = showOverview();
      var row = overview ? null : selectedRow();
      taskMeta.textContent = '';
      autoOpenToggle.hidden = !overview;
      actionsButton.hidden = !row;
      if (!row) {
        closeActionMenu();
        taskStatus.hidden = true;
        taskHandoff.hidden = true;
        taskFast.hidden = true;
        taskTitle.textContent = 'Now';
        taskTitle.title = '';
        resumeSessionButton.hidden = true;
        return;
      }
      // An open ... menu follows the task: rebuild it when its items change (job finished, dismissed...).
      if (!actionMenu.hidden && actionMenu.dataset.signature !== menuSignature(row)) fillMenu(actionMenu, row, actionMenuPick);
      var session = row.session;
      var now = Date.now();
      var badgeClass = rowBadge(row.status);
      var reason = headerReason(row, now);
      taskStatus.hidden = false;
      taskStatus.className = 'status ' + badgeClass;
      taskStatus.textContent = STATUS[badgeClass].label;
      taskStatus.title = reason || STATUS[badgeClass].help;
      taskHandoff.hidden = !row.job;
      taskHandoff.title = row.job ? 'Handoff from Claude to Codex' + (row.olderJobs ? ' · ' + (row.olderJobs + 1) + ' runs on this thread' : '') : '';
      taskFast.hidden = !row.fast;
      taskTitle.textContent = row.title;
      taskTitle.title = row.title;
      resumeSessionButton.hidden = !resumeTarget(row);

      var origin = startedBy(session);
      if (origin) {
        var started = document.createElement('span');
        started.className = 'meta-item started-by actor-' + origin.actor;
        started.title = session.parentThreadId ? 'Child agent of thread ' + session.parentThreadId : 'Session originator: ' + session.originator;
        var who = document.createElement('b');
        who.textContent = origin.label;
        started.append(actorAvatar(origin.actor, true), document.createTextNode('Started by: '), who);
        taskMeta.appendChild(started);
      }
      var metadata = document.createElement(session.threadId ? 'button' : 'span');
      if (session.threadId) metadata.type = 'button';
      metadata.className = 'meta-item' + (session.threadId ? ' meta-button' : '');
      // Narrow screens show the project name, not the full path; the tooltip keeps the full line.
      var narrow = window.matchMedia('(max-width: 760px)').matches;
      metadata.textContent = sessionMetaLine(narrow ? Object.assign({}, session, { cwd: projectName(session.cwd) }) : session);
      metadata.title = sessionMetaLine(session) + (session.threadId ? '\nClick to copy the thread ID' : '');
      if (session.threadId) metadata.addEventListener('click', function () { copyText(session.threadId, metadata, 'Thread copied'); });
      taskMeta.appendChild(metadata);
      var values = [{ text: relativeTime(row.updatedMs), title: 'Last activity' }];
      if (isDismissed(row.id)) values.push({ text: 'Dismissed', title: 'Hidden from every view except History > Dismissed and Everything' });
      values.forEach(function (item) {
        var span = document.createElement('span');
        span.className = 'meta-item';
        span.textContent = item.text;
        span.title = item.title;
        taskMeta.appendChild(span);
      });
      if (reason) {
        var reasonLine = document.createElement('span');
        reasonLine.id = 'wait-reason';
        reasonLine.className = 'meta-item ' + badgeClass;
        reasonLine.textContent = reason;
        reasonLine.title = reason;
        taskMeta.appendChild(reasonLine);
      }
    }

    // -- Feed rendering. Grammar: a message is a card with "sender -> receiver" in the actor's
    // color; Codex work is a collapsed activity log on a teal rail under its turn; System and
    // Plugin text is quiet and collapsed; turn markers are thin centered rules.
    var ACTORS = {
      you: { name: 'You', glyph: 'Y' },
      relay: { name: 'You', glyph: 'Y' },
      claude: { name: 'Claude', glyph: '✳︎' },
      plugin: { name: 'Plugin', glyph: '+' },
      codex: { name: 'Codex', glyph: '>_', mono: true },
      work: { name: 'Codex work', glyph: '>_', mono: true },
      'codex-lead': { name: 'Codex (lead)', glyph: '>_', mono: true },
      system: { name: 'System', glyph: 'i' }
    };
    var LONG_MESSAGE = 3000;

    function actorAvatar(actor, small) {
      var info = ACTORS[actor] || ACTORS.system;
      var avatar = document.createElement('span');
      avatar.className = 'avatar' + (info.mono ? ' mono' : '') + (small ? ' small' : '');
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = info.glyph;
      return avatar;
    }

    function actorName(actor) {
      var name = document.createElement('span');
      name.className = 'who actor-' + actor;
      name.textContent = ACTORS[actor].name;
      return name;
    }

    function textSpan(className, text) {
      var span = document.createElement('span');
      span.className = className;
      span.textContent = text;
      return span;
    }

    // One collapsed summary row: caret, label, one-line preview, time.
    function summaryRow(label, text, ts) {
      var summary = document.createElement('summary');
      summary.append(textSpan('caret', '▸'), textSpan('sum-label', label), textSpan('sum-text', text));
      if (ts) summary.appendChild(textSpan('sum-time', eventTime(ts)));
      return summary;
    }

    function markdownBody(text) {
      var body = document.createElement('div');
      body.className = 'msg-body';
      body.appendChild(renderMarkdown(text, document));
      return body;
    }

    // A conversation message: You, Claude, You relayed, or Codex.
    function createMessage(event, actor, key, session) {
      var route = messageRoute(actor, session);
      var card = document.createElement('article');
      card.className = 'msg actor-' + actor;
      var head = document.createElement('div');
      head.className = 'msg-head';
      head.append(actorAvatar(actor), actorName(route.from), textSpan('route-arrow', '→'), actorName(route.to));

      var text = String(event.text || '');
      var parts = actor === 'codex' ? { body: text, footer: '' } : splitReturnFormat(text);
      var prefix = answerPrefix(parts.body);
      var body = prefix.text;
      var resume = actor !== 'codex' && !prefix.tag && isResumePrompt(body);
      var tag = prefix.tag || (resume ? 'resume' : actor === 'claude' ? 'handoff' : '');
      var question = actor === 'codex' ? feedQuestion(text) : null;
      if (question) body = removeResultSection(body, 'Needs decision');
      if (tag) {
        var tagEl = textSpan('msg-tag' + (resume ? ' neutral' : ''), tag);
        if (resume) tagEl.title = 'Sent by a Resume button or Claude’s resume';
        if (actor === 'relay') tagEl.title = 'Your answer, delivered to Codex through Claude or the viewer’s answer box';
        head.appendChild(tagEl);
      }
      // Who the question is for: you directly, you through Claude in a handoff, or the lead agent.
      var asked = route.to === 'codex-lead'
        ? { actor: 'codex-lead', tag: 'asks the lead agent', title: 'Question for the lead agent' }
        : { actor: 'you', tag: route.to === 'claude' ? 'asks you (via Claude)' : 'asks you', title: route.to === 'claude' ? 'Question for you (via Claude)' : 'Question for you' };
      if (question) {
        var asks = textSpan('msg-tag actor-' + asked.actor, asked.tag);
        asks.title = 'Codex asked a question under Needs decision';
        head.appendChild(asks);
      }
      head.appendChild(textSpan('msg-time', eventTime(event.ts)));
      card.appendChild(head);

      // Tag-only lines become headings in Claude's prompts only; a human's "<div>" stays as typed.
      var markdown = actor === 'claude' ? promptMarkdown(body) : body;
      if (body.length > LONG_MESSAGE) {
        var more = document.createElement('details');
        more.className = 'msg-more';
        more.dataset.key = key + '|full';
        var moreSummary = document.createElement('summary');
        moreSummary.textContent = firstLine(body, 200) + '  ·  show full message (' + body.split('\n').length + ' lines)';
        more.append(moreSummary, markdownBody(markdown));
        card.appendChild(more);
      } else if (body.trim()) {
        card.appendChild(markdownBody(markdown));
      }
      if (question) {
        var ask = document.createElement('div');
        ask.className = 'ask actor-' + asked.actor;
        var askTitle = document.createElement('div');
        askTitle.className = 'ask-title';
        askTitle.append(actorAvatar(asked.actor, true), document.createTextNode(asked.title));
        ask.append(askTitle, markdownBody(question));
        card.appendChild(ask);
      }

      if (parts.footer) {
        var plugin = document.createElement('details');
        plugin.className = 'part actor-plugin';
        plugin.dataset.key = key + '|plugin';
        var summary = summaryRow('Plugin', 'added the return format: Summary, Changed files, Checks run, Needs decision', 0);
        summary.insertBefore(actorAvatar('plugin', true), summary.children[1]);
        var pre = document.createElement('pre');
        pre.textContent = parts.footer;
        plugin.append(summary, pre);
        card.appendChild(plugin);
      }
      return card;
    }

    // What one injected block is, for its line in a System group.
    function systemBlockName(event) {
      var text = String(event.text || '').trim();
      var tag = text.match(/^<([\w-]+)/);
      if (tag) return tag[1].replace(/[_-]+/g, ' ');
      if (/^# AGENTS\.md instructions/.test(text)) return 'AGENTS.md';
      return event.kind === 'agent' ? 'developer text' : 'context';
    }

    // A run of injected context and hook text: one quiet collapsed row.
    function createSystemGroup(group, key) {
      var details = document.createElement('details');
      details.className = 'quiet actor-system';
      details.dataset.key = key;
      var names = [];
      group.steps.forEach(function (step) {
        var name = systemBlockName(step);
        if (names.indexOf(name) === -1) names.push(name);
      });
      var count = group.steps.length;
      var summary = summaryRow('System', (count === 1 ? '1 injected block' : count + ' injected blocks') + ' · ' + names.join(', '), group.steps[0].ts);
      summary.insertBefore(actorAvatar('system', true), summary.children[1]);
      details.appendChild(summary);
      group.steps.forEach(function (step) {
        var item = document.createElement('div');
        item.className = 'quiet-step';
        var head = document.createElement('div');
        head.className = 'quiet-step-head';
        var name = document.createElement('b');
        name.textContent = systemBlockName(step);
        head.append(name, textSpan('', String(step.text || '').length.toLocaleString() + ' chars'), textSpan('', eventTime(step.ts)));
        var pre = document.createElement('pre');
        pre.textContent = step.text || '';
        item.append(head, pre);
        details.appendChild(item);
      });
      return details;
    }

    // A thinking group collapses to one row; expanding shows each step, Markdown rendered.
    // `key` comes from assignEventKeys (technicalEventKey is not collision-safe on its own).
    function createThinkGroupEvent(event, key) {
      var details = document.createElement('details');
      details.className = 'event technical thinkgroup';
      details.dataset.key = key || technicalEventKey(event);
      var summary = summaryRow('', '', event.ts);
      summary.replaceChild(textSpan('step-kind', 'Thinking'), summary.children[1]);
      summary.replaceChild(textSpan('sum-text', event.steps.length + (event.steps.length === 1 ? ' step' : ' steps') + ' · ' + firstLine(event.text, 140)), summary.children[2]);
      details.appendChild(summary);
      event.steps.forEach(function (step) {
        var stepEl = document.createElement('div');
        stepEl.className = 'thinkgroup-step';
        var stepTime = document.createElement('div');
        stepTime.className = 'thinkgroup-step-time';
        stepTime.textContent = eventTime(step.ts);
        var stepBody = document.createElement('div');
        stepBody.className = 'event-body';
        stepBody.appendChild(renderMarkdown(step.text || '', document));
        stepEl.append(stepTime, stepBody);
        details.appendChild(stepEl);
      });
      return details;
    }

    // One Codex work step (command, output, patch, tool call): a collapsed row, full text inside.
    function createEvent(event, key) {
      if (event.kind === 'thinkgroup') return createThinkGroupEvent(event, key);
      var details = document.createElement('details');
      details.className = 'event technical ' + event.kind;
      details.dataset.key = key || technicalEventKey(event);
      var label = ({ cmd: 'Command', out: 'Output', patch: 'Patch', tool: 'Tool' })[event.kind] || 'Step';
      var summary = summaryRow('', '', event.ts);
      summary.replaceChild(textSpan('step-kind', label), summary.children[1]);
      summary.replaceChild(textSpan('step-text', firstLine(event.text, 200)), summary.children[2]);
      var pre = document.createElement('pre');
      pre.textContent = event.detail || event.text || '';
      details.append(summary, pre);
      return details;
    }

    // Consecutive Codex work: one collapsed activity block on the teal rail.
    function createWorkBlock(block, open) {
      var details = document.createElement('details');
      details.className = 'work actor-work';
      details.dataset.key = 'work|' + block.keys[0];
      details.open = !!open;
      if (open) details.dataset.autoOpen = '1'; // opened by default, not by the reader
      var last = block.items[block.items.length - 1];
      var summary = summaryRow('Codex work', workSummary(block.items), last.ts);
      summary.insertBefore(actorAvatar('work', true), summary.children[1]);
      var list = document.createElement('div');
      list.className = 'work-list';
      block.items.forEach(function (item, index) { list.appendChild(createEvent(item, block.keys[index])); });
      details.append(summary, list);
      return details;
    }

    // Turn markers: task started / complete / aborted.
    function createMarker(event) {
      var marker = document.createElement('div');
      marker.className = 'marker ' + event.kind;
      var label = ({ done: '✓ Turn complete', err: 'Turn aborted', sys: 'Turn started' })[event.kind] || firstLine(event.text, 60);
      if (event.kind === 'sys' && !/task started/i.test(event.text || '')) label = firstLine(event.text, 60);
      marker.textContent = label + (event.ts ? ' · ' + eventTime(event.ts) : '');
      return marker;
    }

    function homeCardElement(card, big) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = big ? 'home-card' : 'home-finished';
      var top = document.createElement('div');
      top.className = 'session-top';
      var badgeClass = rowBadge(card.status);
      top.appendChild(statusChip(badgeClass, STATUS[badgeClass].label, STATUS[badgeClass].help));
      if (card.fast) top.appendChild(fastChip());
      if (card.agents) top.appendChild(agentChip(null, card.agents));
      var time = document.createElement('span');
      time.className = 'session-time';
      time.textContent = relativeTime(card.lastMs);
      top.appendChild(time);
      var title = document.createElement('div');
      title.className = 'session-title';
      title.textContent = card.title;
      title.title = card.title;
      var project = document.createElement('div');
      project.className = 'session-project';
      project.textContent = projectName(card.project);
      project.title = card.project;
      var meta = document.createElement('div');
      meta.className = 'session-last';
      var parts = [card.model, card.effort, card.tokens ? 'tokens: ' + card.tokens.toLocaleString() : '', card.detail];
      meta.textContent = parts.filter(Boolean).join(' · ');
      el.append(top, title, project, meta);
      if (card.question) {
        var question = document.createElement('div');
        question.className = 'session-last';
        question.textContent = 'Asked: ' + card.question;
        el.appendChild(question);
      }
      el.addEventListener('click', function () { openHomeCard(card); });
      el.addEventListener('contextmenu', function (event) { openContextMenu(event, findRow(currentRows(), card.id)); });
      return el;
    }

    function openHomeCard(card) {
      lastHomeSignature = '';
      if (card.sessionId && sessions.some(function (s) { return s.id === card.sessionId; })) {
        selectSession(card.sessionId, true);
        return;
      }
      var row = findRow(currentRows(), card.id);
      if (row && row.job) openJob(row.job);
    }

    function renderHome() {
      var data = homeCards(currentRows(), prefs.dismissed, Date.now());
      // stable card fields plus a 10s bucket so relative times still refresh
      var signature = JSON.stringify([
        Math.floor(Date.now() / 10000),
        data.answer.concat(data.attention, data.running, data.finished).map(function (card) {
          return [card.id, card.sessionId, card.status, card.title, card.project,
            card.fast, card.model, card.effort, card.tokens, card.lastMs, card.question];
        })
      ]);
      if (signature === lastHomeSignature) return;
      lastHomeSignature = signature;
      feedInner.textContent = '';
      var wrap = document.createElement('div');
      wrap.id = 'home-view';
      function section(label, cards, attention) {
        if (!cards.length) return;
        var heading = document.createElement('div');
        heading.className = 'home-heading';
        heading.textContent = label + ' (' + cards.length + ')';
        wrap.appendChild(heading);
        var grid = document.createElement('div');
        grid.className = 'home-grid';
        cards.forEach(function (card) {
          var el = homeCardElement(card, true);
          if (attention) el.classList.add('attention');
          grid.appendChild(el);
        });
        wrap.appendChild(grid);
      }
      section('Needs answer', data.answer, false);
      section('Needs attention', data.attention, true);
      section('Running', data.running, false);
      if (!data.answer.length && !data.attention.length && !data.running.length) {
        var empty = document.createElement('div');
        empty.className = 'home-heading';
        empty.textContent = 'Nothing running right now';
        wrap.appendChild(empty);
      }
      if (data.finished.length) {
        var doneHeading = document.createElement('div');
        doneHeading.className = 'home-heading';
        doneHeading.textContent = 'Recently finished';
        wrap.appendChild(doneHeading);
        data.finished.forEach(function (card) { wrap.appendChild(homeCardElement(card, false)); });
        var more = document.createElement('button');
        more.type = 'button';
        more.className = 'toolbar-button home-more';
        more.textContent = 'Show more';
        more.addEventListener('click', function () { chooseView('HISTORY', 'FINISHED'); });
        wrap.appendChild(more);
      }
      feedInner.appendChild(wrap);
      jumpLatest.hidden = true;
    }

    function renderFeed(preservePosition) {
      feedRenderPending = false; // this rebuild covers any batch still waiting for a frame
      // showOverview() covers "no task open" too, so selected is always truthy past this point.
      renderResultCard();
      if (showOverview()) { renderHome(); return; }
      // Keyboard focus on a row survives the rebuild: same data-key, new element.
      var focusHost = feedInner.contains(document.activeElement) ? document.activeElement.closest('[data-key]') : null;
      var focusKey = focusHost ? focusHost.dataset.key : null;
      feedInner.textContent = '';
      var session = currentSession();
      var rawEvents = store[selected] || [];
      var allEvents = groupFeed(rawEvents, session);
      // Keyed off the full, unpaged list so a row's key doesn't shift as
      // "Show earlier activity" changes which slice of it is on screen.
      var allKeys = assignEventKeys(allEvents);
      var renderKey = String(selected || '');
      var defaultLimit = 160;
      var limit = renderLimits[renderKey] || defaultLimit;
      var hiddenCount = Math.max(0, allEvents.length - limit);
      var events = hiddenCount ? allEvents.slice(hiddenCount) : allEvents;
      var keys = hiddenCount ? allKeys.slice(hiddenCount) : allKeys;
      if (!allEvents.length) {
        var empty = document.createElement('div');
        empty.className = 'feed-empty';
        var strong = document.createElement('strong');
        strong.textContent = 'No activity yet';
        var detail = document.createElement('span');
        detail.textContent = 'Codex has not written anything to this session yet.';
        empty.append(strong, detail);
        feedInner.appendChild(empty);
      } else {
        var fragment = document.createDocumentFragment();
        if (hiddenCount) {
          var earlier = document.createElement('button');
          earlier.type = 'button';
          earlier.className = 'load-earlier';
          earlier.textContent = 'Show earlier activity (' + hiddenCount + ' hidden)';
          earlier.addEventListener('click', function () {
            var oldHeight = feed.scrollHeight;
            var oldTop = feed.scrollTop;
            renderLimits[renderKey] = limit + 100;
            renderFeed(true);
            requestAnimationFrame(function () { feed.scrollTop = oldTop + (feed.scrollHeight - oldHeight); });
          });
          fragment.appendChild(earlier);
        }
        // Consecutive Codex work folds into one activity block; everything else stands alone.
        var blocks = [];
        events.forEach(function (event, idx) {
          var actor = messageActor(event, session);
          var last = blocks[blocks.length - 1];
          if (actor === 'work' && last && last.work) { last.items.push(event); last.keys.push(keys[idx]); return; }
          blocks.push(actor === 'work' ? { work: true, items: [event], keys: [keys[idx]] } : { event: event, key: keys[idx], actor: actor });
        });
        var row = selectedRow();
        var lastRaw = rawEvents[rawEvents.length - 1];
        // A session stays Running for 20 s after its last write; a finished turn is not "working".
        var running = !!row && row.status === 'RUNNING' && !(lastRaw && lastRaw.kind === 'done');
        blocks.forEach(function (block, index) {
          // The block Codex is working on right now starts open; older ones start collapsed.
          if (block.work) fragment.appendChild(createWorkBlock(block, running && index === blocks.length - 1));
          else if (block.actor === 'system') fragment.appendChild(createSystemGroup(block.event, block.key));
          else if (block.actor === 'status') fragment.appendChild(createMarker(block.event));
          else fragment.appendChild(createMessage(block.event, block.actor, block.key, session));
        });
        if (running) {
          var working = document.createElement('div');
          working.className = 'working';
          working.setAttribute('role', 'status');
          working.append(document.createTextNode('Codex is working'), textSpan('working-text', '· ' + workingLine(rawEvents)));
          fragment.appendChild(working);
        }
        feedInner.appendChild(fragment);
      }
      feedInner.querySelectorAll('details[data-key]').forEach(function (d) {
        var choice = feedOpenChoices[selected + '|' + d.dataset.key];
        if (choice !== undefined) d.open = choice;
        if (d.dataset.key === focusKey) d.querySelector('summary').focus({ preventScroll: true });
      });
      if (!preservePosition) requestAnimationFrame(scrollToLatest);
      jumpLatest.hidden = true;
    }

    function selectSession(id, byUser) {
      if (byUser) { prefs.autoFollow = false; prefs.home = false; }
      selected = id;
      prefs.selected = id;
      unread.delete(id);
      processPanel.hidden = true;
      closeActionMenu();
      savePrefs();
      applyPrefs();
      renderList();
      renderHeader();
      renderFeed();
      if (window.innerWidth <= 760) document.body.classList.remove('mobile-side-open');
    }

    async function openHistorySession(id) {
      try {
        var response = await fetch('/open?id=' + encodeURIComponent(id), { method: 'POST' });
        if (!response.ok) return;
        selectSession(id, true);
      } catch (_) {}
    }

    async function refreshJobs() {
      try {
        var response = await fetch('/jobs');
        var data = await response.json();
        if (!response.ok) return;
        var previousRow = findRow(currentRows(), selected);
        jobs = data.jobs || [];
        // A handoff finishing changes its row's status just like a session update does. Not on the
        // first load: jobs arriving would look like status changes and move a restored tab/chip.
        if (jobsLoaded) followSelectedStatus(previousRow ? previousRow.status : null);
        jobsLoaded = true;
        renderFilters();
        renderList();
        renderHeader();
        renderResultCard();
        if (showOverview()) renderFeed();
      } catch (_) {}
    }

    // Run picker: every job on the thread, newest first, so earlier runs stay reachable.
    function fillRunPicker(job) {
      var runs = threadRuns(jobs.some(function (entry) { return entry.id === job.id; }) ? jobs : jobs.concat([job]), job);
      jobModalRunsField.hidden = runs.length < 2;
      jobModalRuns.textContent = '';
      runs.forEach(function (run, index) {
        var option = document.createElement('option');
        option.value = run.id;
        var when = relativeTime(Date.parse(run.updatedAt || run.createdAt || '') || 0);
        option.textContent = [index === 0 ? 'Latest run' : 'Run ' + (runs.length - index), run.title || run.kindLabel || 'Codex job', jobStatusLabel(run), when].filter(Boolean).join(' · ');
        jobModalRuns.appendChild(option);
      });
      jobModalRuns.value = job.id;
      jobModalRuns.onchange = function () {
        var picked = runs.find(function (run) { return run.id === jobModalRuns.value; });
        if (picked) openJob(picked);
      };
    }

    async function fetchJobDetail(job) {
      var response = await fetch('/job?dir=' + encodeURIComponent(job.stateDir) + '&id=' + encodeURIComponent(job.id));
      var detail = await response.json();
      if (!response.ok) throw new Error(detail.error || 'Job not found');
      return detail;
    }

    async function loadResultDetail(job, entry) {
      try { entry.detail = await fetchJobDetail(job); }
      catch (error) { entry.error = error.message || String(error); }
      renderResultCard();
    }

    // The card above the feed for a task whose newest run finished. It lives outside
    // #feed-inner and is rebuilt only when its content changes, so live feed updates
    // never touch it: a half-typed answer keeps its focus and cursor.
    function renderResultCard() {
      var row = showOverview() ? null : selectedRow();
      var job = row && row.job;
      if (!job || job.status !== 'completed') {
        resultCardKey = '';
        resultCard.hidden = true;
        resultCard.textContent = '';
        return;
      }
      var stamp = (job.updatedAt || '') + '|' + job.status;
      var entry = resultDetails[job.id];
      if (!entry || entry.stamp !== stamp) {
        entry = resultDetails[job.id] = { stamp: stamp, detail: null, error: '' };
        loadResultDetail(job, entry);
      }
      var target = answerTarget(row, jobs);
      var runs = threadRuns(jobs, job).length;
      var key = JSON.stringify([row.id, job.id, stamp, !!entry.detail, entry.error, target, runs, row.title]);
      if (key === resultCardKey) return;
      resultCardKey = key;
      var old = resultCard.querySelector('.answer-box textarea');
      var focus = old && document.activeElement === old ? [old.selectionStart, old.selectionEnd] : null;
      buildResultCard(row, job, entry, target, runs);
      var fresh = resultCard.querySelector('.answer-box textarea');
      if (focus && fresh) { fresh.focus(); fresh.setSelectionRange(focus[0], focus[1]); }
    }

    function resultSection(heading, markdown, extraClass) {
      var section = document.createElement('div');
      section.className = 'result-section' + (extraClass ? ' ' + extraClass : '');
      var title = document.createElement('h3');
      title.className = 'result-section-title';
      title.textContent = heading;
      var body = document.createElement('div');
      body.className = 'result-section-body';
      body.appendChild(renderMarkdown(markdown, document));
      section.append(title, body);
      return section;
    }

    function buildResultCard(row, job, entry, target, runs) {
      resultCard.textContent = '';
      resultCard.hidden = false;
      var box = document.createElement('div');
      box.className = 'result-card-box actor-codex';
      var head = document.createElement('div');
      head.className = 'result-card-head';
      var toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'result-card-toggle';
      var caret = document.createElement('span');
      caret.className = 'result-card-caret';
      var label = document.createElement('span');
      label.textContent = 'Result from Codex';
      toggle.append(caret, actorAvatar('codex', true), label);
      head.appendChild(toggle);
      if (runs > 1) {
        var runCount = document.createElement('span');
        runCount.className = 'result-card-runs';
        runCount.textContent = runs + ' runs';
        head.appendChild(runCount);
      }
      var spacer = document.createElement('span');
      spacer.className = 'spacer';
      var full = document.createElement('button');
      full.type = 'button';
      full.className = 'toolbar-button';
      full.textContent = 'Show full result';
      full.addEventListener('click', function () { openJob(job); });
      head.append(spacer, full);

      var body = document.createElement('div');
      body.className = 'result-card-body';
      body.id = 'result-card-body';
      toggle.setAttribute('aria-controls', body.id);
      function setOpen(open) {
        body.hidden = !open;
        caret.textContent = open ? '▾' : '▸';
        toggle.setAttribute('aria-expanded', String(open));
      }
      setOpen(!resultCardClosed[job.id]);
      toggle.addEventListener('click', function () {
        resultCardClosed[job.id] = !body.hidden;
        setOpen(body.hidden);
      });
      box.append(head, body);
      resultCard.appendChild(box);

      if (!entry.detail) {
        var note = document.createElement('div');
        note.className = 'result-card-note';
        note.textContent = entry.error ? 'Could not load job result: ' + entry.error + ' ' : 'Loading job result…';
        if (entry.error) {
          // Only on request: an automatic refetch would repeat on every SSE batch.
          var retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'toolbar-button';
          retry.textContent = 'Retry';
          retry.addEventListener('click', function () {
            delete resultDetails[job.id];
            renderResultCard();
          });
          note.appendChild(retry);
        }
        body.appendChild(note);
        return;
      }
      var result = entry.detail.result || {};
      var model = resultCardModel(result.rawOutput, result.touchedFiles);
      if (model.plain) body.appendChild(resultSection('Answer', model.plain));
      model.sections.forEach(function (section) { body.appendChild(resultSection(section.heading, section.body)); });
      if (!model.plain && !model.sections.length && !model.question) {
        var empty = document.createElement('div');
        empty.className = 'result-card-note';
        empty.textContent = 'No answer text was recorded. Show full result has the details.';
        body.appendChild(empty);
      }
      if (!model.question) return;
      var question = resultSection('Needs decision: a question for you', model.question, 'question');
      body.appendChild(question);
      if (!target) {
        // Answered outside the viewer (rowStatus made it Finished): the question stays, no box.
        if (row.status === 'FINISHED') return;
        var busy = document.createElement('div');
        busy.className = 'result-card-note';
        busy.textContent = 'A run on this thread is still working. Answer once it finishes.';
        question.appendChild(busy);
        return;
      }
      var answer = document.createElement('div');
      answer.className = 'answer-box';
      var input = document.createElement('textarea');
      input.placeholder = 'Your answer';
      input.setAttribute('aria-label', 'Your answer to the question above');
      input.value = answerDrafts[job.id] || '';
      var actions = document.createElement('div');
      actions.className = 'answer-box-actions';
      var send = document.createElement('button');
      send.type = 'button';
      send.textContent = 'Answer and resume';
      send.title = 'Opens the resume dialog with your answer as the prompt (asks first)';
      send.disabled = !answerPrompt(input.value);
      input.addEventListener('input', function () {
        answerDrafts[job.id] = input.value;
        send.disabled = !answerPrompt(input.value);
      });
      send.addEventListener('click', function () {
        var prompt = answerPrompt(input.value);
        if (prompt) openResumeModal(target, row.title, prompt);
      });
      actions.appendChild(send);
      answer.append(input, actions);
      question.appendChild(answer);
    }

    async function openJob(job) {
      var token = ++jobModalToken;
      fillRunPicker(job);
      jobModalTitle.textContent = job.title || job.kindLabel || 'Job result';
      jobModalMeta.textContent = '';
      jobModalMeta.appendChild(modalRow('Summary', job.summary || ''));
      jobModalMeta.appendChild(modalRow('Thread', job.threadId || '', true));
      if (job.fast) jobModalMeta.appendChild(modalRow('Tier', 'fast (priority)'));
      jobModalResult.textContent = 'Loading job result\u2026';
      // Same rule and folder as every other Resume, so no Resume while the thread's session is LIVE.
      var threadSession = job.threadId ? sessions.find(function (s) { return s.threadId === job.threadId; }) : null;
      var target = resumeTarget({ job: job, session: threadSession || null, project: '' });
      jobModalResume.hidden = !target;
      jobModalResume.onclick = target ? function () {
        jobModal.hidden = true;
        openResumeModal(target, job.title);
      } : null;
      var wasHidden = jobModal.hidden;
      jobModal.hidden = false;
      if (wasHidden) jobModalClose.focus();
      try {
        var detail = await fetchJobDetail(job);
        if (token !== jobModalToken) return; // another run was picked meanwhile
        jobModalTitle.textContent = detail.title || job.title || 'Job result';
        jobModalMeta.textContent = '';
        jobModalMeta.appendChild(modalRow('Summary', detail.summary || ''));
        jobModalMeta.appendChild(modalRow('Thread', detail.threadId || '', true));
        if (job.fast) jobModalMeta.appendChild(modalRow('Tier', 'fast (priority)'));
        var resultText = detail.rendered
          || [detail.errorMessage, detail.stderrTail].filter(Boolean).join('\n\n')
          || 'No rendered result is available.';
        jobModalResult.textContent = '';
        jobModalResult.appendChild(renderMarkdown(resultText, document));
      } catch (error) {
        if (token !== jobModalToken) return;
        jobModalResult.textContent = 'Could not load job result: ' + error.message;
      }
    }

    function newestRunning() { return sessions.find(function (session) { return session.status === 'LIVE'; }); }
    function scrollToLatest() { feed.scrollTop = feed.scrollHeight; jumpLatest.hidden = true; }
    function nearBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 90; }

    async function copyText(text, button, successLabel) {
      var old = button.textContent;
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = successLabel;
        window.setTimeout(function () { button.textContent = old; }, 1200);
      } catch (_) {
        window.prompt('Copy this value:', text);
      }
    }

    function controlField(labelText, control) {
      var label = document.createElement('label');
      label.className = 'control-field';
      var text = document.createElement('span');
      text.textContent = labelText;
      label.append(text, control);
      return label;
    }

    function controlSelect(options) {
      var select = document.createElement('select');
      options.forEach(function (item) {
        var option = document.createElement('option');
        option.value = item[0];
        option.textContent = item[1];
        select.appendChild(option);
      });
      return select;
    }

    function effortSelect() {
      return controlSelect([
        ['', 'Default (xhigh)'], ['low', 'Low'], ['medium', 'Medium'], ['high', 'High'],
        ['xhigh', 'XHigh'], ['max', 'Max'], ['ultra', 'Ultra']
      ]);
    }

    function sandboxSelect() {
      return controlSelect([
        ['', 'Default'], ['danger-full-access', 'danger-full-access'],
        ['workspace-write', 'workspace-write'], ['read-only', 'read-only']
      ]);
    }

    function textInput(placeholder) {
      var input = document.createElement('input');
      input.type = 'text';
      input.placeholder = placeholder || '';
      return input;
    }

    function controlCheckbox(textContent) {
      var label = document.createElement('label');
      label.className = 'control-checkbox';
      var input = document.createElement('input');
      input.type = 'checkbox';
      var text = document.createElement('span');
      text.textContent = textContent;
      label.append(input, text);
      return { label: label, input: input };
    }

    // cancelText defaults to 'Cancel' (Resume); Cancel job passes 'Back' so a dialog
    // whose confirm button reads "Cancel job" never shows two buttons both saying Cancel.
    // Every open sets it explicitly so one dialog's label never leaks into the next.
    function showControlModal(title, confirmText, cancelText) {
      controlModalTitle.textContent = title;
      controlModalBody.textContent = '';
      controlModalError.textContent = '';
      controlModalConfirm.textContent = confirmText;
      controlModalConfirm.disabled = false;
      controlModalConfirm.classList.remove('danger');
      controlModalCancel.textContent = cancelText || 'Cancel';
      controlAction = null;
      controlModal.hidden = false;
    }

    function closeControlModal() {
      controlModal.hidden = true;
      controlAction = null;
    }

    function openResumeModal(session, title, promptText) {
      showControlModal('Resume Codex thread?', 'Resume');
      controlModalBody.appendChild(modalRow('Task', title || 'Codex task'));
      controlModalBody.appendChild(modalRow('Project', session.cwd || ''));
      controlModalBody.appendChild(modalRow('Thread', session.threadId || '', true));
      var prompt = document.createElement('textarea');
      prompt.placeholder = 'Optional prompt override';
      prompt.value = promptText || '';
      controlModalBody.appendChild(controlField('Prompt override', prompt));
      var effort = effortSelect();
      var model = textInput('default');
      var sandbox = sandboxSelect();
      var write = controlCheckbox('Allow writes');
      var fast = controlCheckbox('Fast (priority processing \u2014 uses more quota)');
      var grid = document.createElement('div');
      grid.className = 'control-grid';
      grid.append(controlField('Effort', effort), controlField('Model', model), controlField('Sandbox', sandbox), write.label, fast.label);
      controlModalBody.appendChild(grid);
      controlAction = function () {
        return {
          endpoint: '/resume',
          body: resumeBody(session, {
            prompt: prompt.value.trim(), effort: effort.value, model: model.value.trim(),
            write: write.input.checked, fast: fast.input.checked, sandbox: sandbox.value
          }),
          onSuccess: function () { chooseView('HANDOFFS', 'ALL'); }
        };
      };
      prompt.focus();
    }

    function openCancelModal(job) {
      showControlModal('Cancel running job?', 'Cancel job', 'Back');
      controlModalConfirm.classList.add('danger');
      controlModalBody.appendChild(modalRow('Task', job.title || job.id || 'Codex job'));
      controlModalBody.appendChild(modalRow('Project', job.workspaceRoot || ''));
      controlModalBody.appendChild(modalRow('Job ID', job.id || '', true));
      controlModalBody.appendChild(modalWarning('red', 'Cancelling stops this job and cannot be undone.'));
      controlAction = function () {
        return {
          endpoint: '/cancel',
          body: { cwd: job.workspaceRoot, jobId: job.id },
          onSuccess: refreshJobs
        };
      };
      controlModalCancel.focus();
    }

    function modalRow(label, value, mono) {
      var row = document.createElement('div');
      row.className = 'stop-modal-row';
      var name = document.createElement('span');
      name.className = 'stop-modal-label';
      name.textContent = label;
      var val = document.createElement('span');
      val.className = 'stop-modal-value' + (mono ? ' mono' : '');
      val.textContent = value;
      row.append(name, val);
      return row;
    }

    function modalWarning(kind, text) {
      var warning = document.createElement('div');
      warning.className = 'stop-modal-warning ' + kind;
      warning.textContent = text;
      return warning;
    }

    function openStopModal(proc) {
      var session = currentSession();
      var startedMs = sessionStart(selected);
      var warnings = processWarnings(proc, startedMs);
      pendingKillPid = proc.pid;
      stopModalBody.textContent = '';
      stopModalBody.appendChild(modalRow('Task', (session && session.title) || 'Unknown task'));
      stopModalBody.appendChild(modalRow('Project', session ? projectName(session.cwd) : 'Unknown'));
      stopModalBody.appendChild(modalRow('PID', proc.pid + '  (' + proc.name + ')', true));
      stopModalBody.appendChild(modalRow('Started', proc.started ? new Date(proc.started).toLocaleTimeString() : 'Unknown'));
      stopModalBody.appendChild(modalRow('Command', String(proc.cmd || '(unknown command line)'), true));
      if (warnings.shared) {
        stopModalBody.appendChild(modalWarning('red',
          'Shared Codex process (app-server / MCP). It can host several tasks at once — stopping it stops ALL of them, not just this one.'));
      }
      if (warnings.timeMatch) {
        stopModalBody.appendChild(modalWarning('ok', 'Process start time matches this task’s start time.'));
      } else {
        stopModalBody.appendChild(modalWarning('yellow',
          'This process does not match this task’s start time. The task’s own process may already have exited.'));
      }
      stopModalBody.appendChild(modalWarning('red', 'Stopping kills the process and its entire child tree. This cannot be undone.'));
      stopModalConfirm.hidden = false;
      stopModalConfirm.disabled = false;
      stopModalCancel.textContent = 'Cancel';
      stopModal.hidden = false;
      stopModalCancel.focus();
    }

    controlModalForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      if (!controlAction) return;
      controlModalError.textContent = '';
      controlModalConfirm.disabled = true;
      try {
        var action = controlAction();
        var response = await fetch(action.endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(action.body)
        });
        var data = {};
        try { data = await response.json(); } catch (_) {}
        if (!response.ok || data.ok === false) {
          controlModalError.textContent = data.error || ('Request failed with HTTP ' + response.status);
          if (response.status === 409) {
            controlModalError.textContent += '\nCancel that run first: ⋯ menu > Cancel job.';
          }
          return;
        }
        var onSuccess = action.onSuccess;
        closeControlModal();
        if (onSuccess) onSuccess(data);
      } catch (error) {
        controlModalError.textContent = 'Request failed: ' + error.message;
      } finally {
        if (!controlModal.hidden) controlModalConfirm.disabled = false;
      }
    });
    controlModalCancel.addEventListener('click', closeControlModal);
    controlModal.addEventListener('click', function (event) {
      if (event.target === controlModal) closeControlModal();
    });

    stopModalConfirm.addEventListener('click', async function () {
      if (pendingKillPid == null) return;
      stopModalConfirm.disabled = true;
      var message = '';
      try { message = await (await fetch('/kill?pid=' + pendingKillPid, { method: 'POST' })).text(); }
      catch (error) { message = 'Request failed: ' + error; }
      pendingKillPid = null;
      stopModalBody.textContent = '';
      stopModalBody.appendChild(modalWarning(/^killed/i.test(message) ? 'ok' : 'yellow', message));
      stopModalConfirm.hidden = true;
      stopModalCancel.textContent = 'Close';
      processPanel.hidden = true;
    });
    stopModalCancel.addEventListener('click', function () {
      stopModal.hidden = true;
      pendingKillPid = null;
    });
    stopModal.addEventListener('click', function (event) {
      if (event.target === stopModal) { stopModal.hidden = true; pendingKillPid = null; }
    });
    jobModalClose.addEventListener('click', function () { jobModal.hidden = true; });
    jobModal.addEventListener('click', function (event) {
      if (event.target === jobModal) jobModal.hidden = true;
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        var closedSomething = false;
        if (!stopModal.hidden) { stopModal.hidden = true; pendingKillPid = null; closedSomething = true; }
        if (!jobModal.hidden) { jobModal.hidden = true; closedSomething = true; }
        if (!controlModal.hidden) { closeControlModal(); closedSomething = true; }
        if (!contextMenu.hidden) { closeContextMenu(); closedSomething = true; }
        if (!actionMenu.hidden) { closeActionMenu(); closedSomething = true; }
        // Nothing else was open: on mobile, Escape closes the drawer instead.
        if (!closedSomething && document.body.classList.contains('mobile-side-open')) {
          document.body.classList.remove('mobile-side-open');
        }
        return;
      }
      if (event.key === '/' && !isEditableElement(document.activeElement) &&
        stopModal.hidden && jobModal.hidden && controlModal.hidden) {
        event.preventDefault();
        search.focus();
      }
    });

    document.getElementById('side-backdrop').addEventListener('click', function () {
      document.body.classList.remove('mobile-side-open');
    });

    function rovingKeydown(bar) {
      return function (event) {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        var buttons = Array.prototype.slice.call(bar.querySelectorAll('button'));
        var current = buttons.indexOf(document.activeElement);
        if (current === -1) return;
        event.preventDefault();
        var next = rovingFocusIndex(current, buttons.length, event.key);
        buttons[next].focus();
      };
    }
    tabsBar.addEventListener('keydown', rovingKeydown(tabsBar));
    chipsBar.addEventListener('keydown', rovingKeydown(chipsBar));

    resumeSessionButton.addEventListener('click', function () {
      var row = selectedRow();
      var target = row && resumeTarget(row);
      if (target) openResumeModal(target, row.title);
    });

    document.getElementById('open-elsewhere-show').addEventListener('click', function () {
      var row = findRow(currentRows(), selected);
      if (!row) return;
      var view = viewContaining(row, prefs.tab, prefs.chip, prefs.dismissed);
      chooseView(view.tab, view.chip);
    });

    search.addEventListener('input', function () {
      prefs.query = search.value;
      savePrefs();
      window.clearTimeout(historySearchTimer);
      lastListSignature = '';
      renderList();
      var query = String(prefs.query || '').trim();
      if (!query) {
        historyResults = [];
        lastListSignature = '';
        renderList();
        return;
      }
      historySearchTimer = window.setTimeout(async function () {
        try {
          var response = await fetch('/search?q=' + encodeURIComponent(query));
          var data = await response.json();
          if (String(prefs.query || '').trim() !== query) return; // stale response
          historyResults = data.results || [];
        } catch (_) {
          historyResults = [];
        }
        lastListSignature = '';
        renderList();
      }, 250);
    });
    autoOpenToggle.addEventListener('click', function () {
      setAutoOpen(!prefs.autoFollow, newestRunning());
      applyPrefs();
      renderFilters();
      renderList();
      renderHeader();
      renderFeed();
    });
    jumpLatest.addEventListener('click', scrollToLatest);
    // toggle does not bubble: capture it. Rows restored by renderFeed fire it too, harmlessly.
    feedInner.addEventListener('toggle', function (event) {
      var row = event.target;
      if (!row.dataset || !row.dataset.key || showOverview()) return;
      var id = selected + '|' + row.dataset.key;
      if (row.open !== (row.dataset.autoOpen === '1')) feedOpenChoices[id] = row.open;
      else delete feedOpenChoices[id];
    }, true);
    feed.addEventListener('scroll', function () {
      jumpLatest.hidden = showOverview() || nearBottom();
    }, { passive: true });

    document.getElementById('hide-side').addEventListener('click', function () {
      if (window.innerWidth <= 760) document.body.classList.remove('mobile-side-open');
      else {
        prefs.sideCollapsed = true;
        savePrefs();
        applyPrefs();
      }
    });
    document.getElementById('show-side').addEventListener('click', function () {
      if (window.innerWidth <= 760) document.body.classList.add('mobile-side-open');
      else {
        prefs.sideCollapsed = false;
        savePrefs();
        applyPrefs();
      }
    });

    splitter.addEventListener('pointerdown', function (event) {
      splitter.setPointerCapture(event.pointerId);
      splitter.classList.add('dragging');
    });
    splitter.addEventListener('pointermove', function (event) {
      if (!splitter.hasPointerCapture(event.pointerId)) return;
      prefs.sideWidth = clamp(event.clientX, 240, window.innerWidth * .55);
      document.documentElement.style.setProperty('--sidebar-width', prefs.sideWidth + 'px');
    });
    splitter.addEventListener('pointerup', function (event) {
      if (splitter.hasPointerCapture(event.pointerId)) splitter.releasePointerCapture(event.pointerId);
      splitter.classList.remove('dragging');
      savePrefs();
    });
    splitter.addEventListener('keydown', function (event) {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      prefs.sideWidth = clamp(prefs.sideWidth + (event.key === 'ArrowRight' ? 16 : -16), 240, window.innerWidth * .55);
      savePrefs();
      applyPrefs();
    });

    actionsButton.addEventListener('click', function () {
      if (!actionMenu.hidden) { closeActionMenu(); return; }
      var row = selectedRow();
      if (!row || !fillMenu(actionMenu, row, actionMenuPick)) return;
      actionMenu.hidden = false;
      actionsButton.setAttribute('aria-expanded', 'true');
    });
    document.addEventListener('click', function (event) {
      closeContextMenu();
      if (actionMenu.hidden || actionMenu.contains(event.target) || actionsButton.contains(event.target)) return;
      closeActionMenu();
    });

    // The one copy-command table, shared by both menus.
    var COPY_COMMANDS = {
      'copy-resume': { build: resumeCommand, done: 'Resume command copied' },
      'copy-continue': { build: continueCommand, done: 'Continue command copied' },
      'copy-fork': { build: forkCommand, done: 'Fork command copied' },
      'copy-archive': { build: archiveCommand, done: 'Archive command copied' },
      'copy-unarchive': { build: unarchiveCommand, done: 'Unarchive command copied' }
    };

    function toggleDismissed(id) {
      var ids = prefs.dismissed = prefs.dismissed || [];
      var at = ids.indexOf(id);
      if (at === -1) ids.push(id); else ids.splice(at, 1);
      savePrefs();
      lastListSignature = '';
      lastFilterSignature = '';
      lastHomeSignature = '';
      renderFilters();
      renderList();
      renderHeader();
      if (showOverview()) renderFeed();
    }

    function closeContextMenu() { contextMenu.hidden = true; }

    // One handler table for the ... menu and the right-click menu (ids from menuItems).
    function runMenuAction(id, row, button) {
      var copy = COPY_COMMANDS[id];
      if (copy) {
        if (row.threadId) copyText(copy.build(row.threadId), button, copy.done);
        return;
      }
      if (id === 'dismiss') { toggleDismissed(row.id); return; }
      if (id === 'resume-job' || id === 'resume-session') {
        var target = resumeTarget(row);
        if (target) openResumeModal(target, row.title);
        return;
      }
      if (id === 'cancel-job') { openCancelModal(row.job); return; }
      if (id === 'show-result') { openJob(row.job); return; }
      if (id === 'show-processes' || id === 'stop') {
        // From an overview card the task is not open yet: open it so the panel has a header.
        if (row.session.id !== selected || showOverview()) selectSession(row.session.id, true);
        showProcesses(id === 'stop');
      }
    }

    // Copy items keep the ... menu open so their "copied" label shows, as today.
    function actionMenuPick(id) { if (id.indexOf('copy-') !== 0) closeActionMenu(); }
    // What the menu shows for this row; renderHeader rebuilds an open ... menu when it changes.
    function menuSignature(row) {
      return JSON.stringify(menuItems(row, { dismissed: isDismissed(row.id) }).map(function (item) { return [item.id, item.label]; }));
    }

    // Grouped menu items as DOM (labels via textContent). onPick(id) runs before the action.
    // Returns the number of items.
    function fillMenu(container, row, onPick) {
      var items = menuItems(row, { dismissed: isDismissed(row.id) });
      container.dataset.signature = menuSignature(row);
      container.textContent = '';
      var group = null;
      items.forEach(function (entry) {
        if (entry.group !== group) {
          group = entry.group;
          var label = document.createElement('div');
          label.className = 'menu-group';
          label.textContent = group;
          container.appendChild(label);
        }
        var button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('role', 'menuitem');
        button.dataset.action = entry.id;
        button.textContent = entry.label;
        button.title = entry.title;
        if (entry.danger) button.className = 'danger';
        button.addEventListener('click', function () {
          onPick(entry.id);
          runMenuAction(entry.id, row, button);
        });
        container.appendChild(button);
      });
      return items.length;
    }

    function openContextMenu(event, row) {
      if (!row || !fillMenu(contextMenu, row, closeContextMenu)) return;
      event.preventDefault();
      contextMenu.hidden = false;
      var pad = 8;
      contextMenu.style.left = Math.max(pad, Math.min(event.clientX, window.innerWidth - contextMenu.offsetWidth - pad)) + 'px';
      contextMenu.style.top = Math.max(pad, Math.min(event.clientY, window.innerHeight - contextMenu.offsetHeight - pad)) + 'px';
    }

    list.addEventListener('scroll', closeContextMenu, { passive: true });
    // Capture phase: must run before the row handler that opens the menu, or it would close it again.
    document.addEventListener('contextmenu', function (event) {
      if (!contextMenu.hidden && !contextMenu.contains(event.target)) closeContextMenu();
    }, true);

    // The process panel under the header, for the open task (STOP on a row opens the Stop dialog).
    // stopBest also opens the Stop dialog for a process that started with the task (it asks first).
    async function showProcesses(stopBest) {
      closeActionMenu();
      processPanel.hidden = false;
      processPanel.textContent = 'Looking for matching Codex processes…';
      var processes = [];
      try { processes = await (await fetch('/procs')).json(); } catch (_) {}
      processPanel.textContent = '';
      if (!processes.length) {
        processPanel.textContent = 'No matching Codex processes were found. The task may already have exited.';
        return;
      }
      var started = sessionStart(selected);
      processes.sort(function (a, b) { return Math.abs(a.started - started) - Math.abs(b.started - started); });
      var closeMatch = processes.some(function (process) { return started && Math.abs(process.started - started) < 15000; });
      if (started && !closeMatch) {
        var warning = document.createElement('div');
        warning.style.color = 'var(--yellow)';
        warning.style.marginBottom = '8px';
        warning.textContent = 'No process closely matches this task start time. Shared app-server processes can host several tasks; stopping one may affect all of them.';
        processPanel.appendChild(warning);
      }
      processes.forEach(function (process) {
        var row = document.createElement('div');
        row.className = 'process';
        var kill = document.createElement('button');
        kill.type = 'button';
        kill.className = 'kill-button';
        kill.textContent = 'STOP';
        kill.addEventListener('click', function () { openStopModal(process); });
        var description = document.createElement('span');
        description.className = 'mono';
        description.textContent = 'PID ' + process.pid + '  ' + process.name + '  ' + String(process.cmd || '').slice(0, 180);
        row.append(kill, description);
        processPanel.appendChild(row);
      });
      // Only a process started with the task is offered straight away; otherwise the user picks.
      if (stopBest && closeMatch) openStopModal(processes[0]);
    }

    window.addEventListener('resize', function () {
      applyPrefs();
      if (window.innerWidth > 760) document.body.classList.remove('mobile-side-open');
      renderHeader(); // the meta line shows the project name at 760 px and below, the full path above
    });

    // Grouping (thinking steps) means new events can't just be appended one at a time; a full
    // rebuild keeps counts and groups correct. It runs once per frame however many batches came,
    // and waits while the reader has text selected in the feed (the rebuild would wipe it).
    // Scroll position is unaffected: new content only lands below what is on screen.
    function requestFeedRender() {
      feedRenderPending = true;
      if (!feedRenderFrame) feedRenderFrame = requestAnimationFrame(flushFeedRender);
    }
    function flushFeedRender() {
      feedRenderFrame = 0;
      if (!feedRenderPending || showOverview()) return;
      if (selectionInside(window.getSelection(), feedInner)) return; // selectionchange retries
      var shouldFollow = nearBottom();
      renderFeed(!shouldFollow);
      if (!shouldFollow) jumpLatest.hidden = false;
    }
    document.addEventListener('selectionchange', function () {
      if (feedRenderPending && !feedRenderFrame) feedRenderFrame = requestAnimationFrame(flushFeedRender);
    });

    var events = new EventSource('/events');
    events.onopen = function () { setConnection('connected', 'Live updates connected'); };
    events.onerror = function () { setConnection('disconnected', 'Reconnecting\u2026'); };
    events.onmessage = function (message) {
      var data = JSON.parse(message.data);
      if (data.type === 'sessions') {
        var previousSelectedRow = findRow(currentRows(), selected);
        var previousSelectedStatus = previousSelectedRow ? previousSelectedRow.status : null;
        data.sessions.forEach(function (session) {
          var oldStatus = previousStatus[session.id];
          if (seeded && session.id !== selected && oldStatus !== session.status) unread.add(session.id);
          previousStatus[session.id] = session.status;
        });
        sessions = data.sessions;
        seeded = true;
        // forget dismissals for sessions and job-only rows that fell out of the tracked lists
        if (sessions.length && (prefs.dismissed || []).length) {
          var kept = keptDismissed(prefs.dismissed, sessions, jobs, jobsLoaded);
          if (kept.length !== prefs.dismissed.length) { prefs.dismissed = kept; savePrefs(); }
        }
        if (selected && !sessions.some(function (session) { return session.id === selected; })) selected = null;
        followRunningSession(newestRunning());
        if (!selected && sessions.length) selectSession(sessions[0].id, false);
        followSelectedStatus(previousSelectedStatus);
        renderFilters();
        renderList();
        renderHeader();
        renderResultCard();
        if (showOverview()) renderFeed();
      }
      if (data.type === 'snapshot') {
        store[data.session] = data.events;
        if (data.session === selected) renderFeed();
      }
      if (data.type === 'events') {
        var existing = store[data.session] = store[data.session] || [];
        existing.push.apply(existing, data.events);
        if (existing.length > 500) existing.splice(0, existing.length - 500);
        if (data.session === selected && !showOverview()) {
          requestFeedRender();
        } else if (data.session !== selected) {
          unread.add(data.session);
          renderList();
        }
      }
    };

    var notifications = new EventSource('/notifications');
    notifications.onmessage = function (message) {
      try {
        var data = JSON.parse(message.data);
        if (data.type === 'job') refreshJobs();
      } catch (_) {}
    };

    // Prefs saved before the tabs carry filter/home instead of tab/chip. TABS exists only from here on.
    Object.assign(prefs, savedView(prefs));
    delete prefs.filter;
    delete prefs.autoScroll; // dropped pref: auto-scroll is now always the follow-at-bottom behavior
    applyPrefs();
    renderFilters();
    renderList();
    renderHeader();
    renderFeed();
    refreshJobs();
    window.setInterval(function () { renderList(); renderHeader(); if (showOverview()) renderFeed(); }, 10000);
    // Rows merge job state into every tab, so job liveness is polled everywhere.
    window.setInterval(refreshJobs, 5000);
  </script>
</body>
</html>
